<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hulum Gebeya - Location Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #0F172A;
            box-sizing: border-box;
            padding: 20px;
        }

        .permission-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .brand-logo {
            font-size: 20px;
            font-weight: 800;
            color: #081B38;
            letter-spacing: -0.5px;
            margin-bottom: 20px;
        }

        .icon-container {
            width: 56px;
            height: 56px;
            background: #F0F9FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            border: 1px solid #BAE6FD;
            color: #0284C7;
        }

        .icon-container svg {
            width: 26px;
            height: 26px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 800;
            color: #0F172A;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 13.5px;
            color: #64748B;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .enable-btn {
            width: 100%;
            background: #081B38;
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            padding: 14px;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(8, 27, 56, 0.15);
        }

        .enable-btn:active {
            transform: scale(0.98);
            background: #0F2C59;
        }

        .footer-note {
            font-size: 11.5px;
            color: #94A3B8;
            margin-top: 16px;
            line-height: 1.4;
        }

        .spinner-overlay {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid #E2E8F0;
            border-top-color: #0284C7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="permission-card" id="permissionCard">
        <!-- Default State UI -->
        <div id="defaultStateContent" style="width: 100%;">
            <div class="brand-logo">Hulum Gebeya</div>

            <div class="icon-container" style="margin: 0 auto 18px auto;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                    <circle cx="12" cy="10" r="3"></circle>
                </svg>
            </div>
            
            <h1 class="card-title">Enable Location Access</h1>
            <p class="card-desc">Allow location permissions to discover nearby rental items and listings around you instantly.</p>

            <button class="enable-btn" onclick="requestLocation()">Enable Location</button>
            <div class="footer-note">Required strictly to display proximity distance for rental items.</div>
        </div>

        <!-- Loading / Acquiring State UI -->
        <div class="spinner-overlay" id="spinnerStateContent">
            <div class="spinner"></div>
            <div style="font-size: 14px; font-weight: 700; color: #0F172A;" id="loadingStatusText">Locating your position...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, limitToLast, get, orderByChild, startAt, endAt } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXoIY6Q1Cf3Dw0jU5VImIqxchW79OME6Q",
            authDomain: "delala-1b582.firebaseapp.com",
            databaseURL: "https://delala-1b582-default-rtdb.firebaseio.com",
            projectId: "delala-1b582",
            storageBucket: "delala-1b582.firebasestorage.app",
            messagingSenderId: "1073041850834",
            appId: "1:1073041850834:web:fe5d0095c3ff1b238f480b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const BITS = [16, 8, 4, 2, 1];
        const BASE32 = "0123456789bcdefghjkmnpqrstuvwxyz";

        function encodeFastGeohash(latitude, longitude, precision = 3) {
            let isEven = true, lat = [-90.0, 90.0], lon = [-180.0, 180.0], bit = 0, ch = 0, geohash = "";
            while (geohash.length < precision) {
                let mid = isEven ? (lon[0] + lon[1]) / 2 : (lat[0] + lat[1]) / 2;
                if (isEven) { if (longitude > mid) { ch |= BITS[bit]; lon[0] = mid; } else lon[1] = mid; }
                else { if (latitude > mid) { ch |= BITS[bit]; lat[0] = mid; } else lat[1] = mid; }
                isEven = !isEven;
                if (bit < 4) bit++; else { geohash += BASE32[ch]; bit = 0; ch = 0; }
            }
            return geohash;
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = (lat2 - lat1) * (Math.PI / 180); const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function isRentalCategory(item) {
            if (!item) return false;
            const rType = String(item.rentalType || '').trim().toLowerCase();
            const cat = String(item.category || '').trim().toLowerCase();
            return rType.length > 0 || cat.includes('rental') || cat.includes('rent');
        }

        function itemMatchesActiveCategory(item) {
            const activeCategoryFilter = sessionStorage.getItem('rental_cat_filter');
            if (!activeCategoryFilter || activeCategoryFilter === 'all') return true;

            const rawCatStr = [
                item.rentalSubCategory, 
                item.subCategory, 
                item.category, 
                item.rentalType, 
                item.title,
                item.mainCategory
            ].filter(Boolean).join(' ').toLowerCase();

            const noSpaceCatStr = rawCatStr.replace(/\s/g, ''); 
            const targetCat = activeCategoryFilter.toLowerCase().replace(/\s/g, '');
            
            return rawCatStr.includes(targetCat) || noSpaceCatStr.includes(targetCat);
        }

        function extractItemCoordinates(item) {
            if (item.location && typeof item.location === 'object') {
                const lat = parseFloat(item.location.latitude); const lng = parseFloat(item.location.longitude);
                if (!isNaN(lat) && !isNaN(lng)) return { lat, lng };
            }
            const fallbackLat = item.latitude ?? item.lat ?? item.locationDetails?.lat ?? item.coordinates?.lat;
            const fallbackLng = item.longitude ?? item.lng ?? item.locationDetails?.lng ?? item.coordinates?.lng;
            if (fallbackLat !== undefined && fallbackLng !== undefined) {
                const pLat = parseFloat(fallbackLat); const pLng = parseFloat(fallbackLng);
                if (!isNaN(pLat) && !isNaN(pLng)) return { lat: pLat, lng: pLng };
            }
            return null;
        }

        async function fetchNearbyItems(coords) {
            document.getElementById('loadingStatusText').innerText = "Searching nearby items...";
            const userGeohash = encodeFastGeohash(coords.lat, coords.lng, 3);
            const nodePaths = ['posts', 'delala_new'];
            const matchingItems = [];
            const seenIds = new Set();

            try {
                for (const nodePath of nodePaths) {
                    const q = query(ref(db, nodePath), orderByChild('geohash'), startAt(userGeohash), endAt(userGeohash + '\uf8ff'));
                    const snapshot = await get(q);
                    
                    let itemsFound = false;
                    snapshot.forEach((childSnap) => {
                        itemsFound = true;
                        processItem(childSnap, nodePath, coords, seenIds, matchingItems);
                    });

                    if (!itemsFound) {
                        const fallbackQ = query(ref(db, nodePath), limitToLast(60));
                        const fbSnapshot = await get(fallbackQ);
                        fbSnapshot.forEach((childSnap) => {
                            processItem(childSnap, nodePath, coords, seenIds, matchingItems);
                        });
                    }
                }
                
                matchingItems.sort((a, b) => a._calculatedDistance - b._calculatedDistance);
                
                sessionStorage.setItem('hulum_external_filter', JSON.stringify({ 
                    filter: 'gps', 
                    coords: coords, 
                    items: matchingItems 
                }));
                
                window.location.replace('rental.html');
                
            } catch (error) {
                window.location.replace('rental.html');
            }
        }

        function processItem(childSnap, nodePath, coords, seenIds, matchingItems) {
            const rawItem = { id: childSnap.key, _dbPath: nodePath, ...childSnap.val() };
            
            if (!seenIds.has(rawItem.id) && isRentalCategory(rawItem) && itemMatchesActiveCategory(rawItem)) {
                const itemCoords = extractItemCoordinates(rawItem);
                if (itemCoords) {
                    const dist = calculateDistanceKm(coords.lat, coords.lng, itemCoords.lat, itemCoords.lng);
                    if (dist <= 50) { 
                        rawItem._calculatedDistance = dist; 
                        matchingItems.push(rawItem); 
                        seenIds.add(rawItem.id); 
                    }
                }
            }
        }

        window.requestLocation = function() {
            if (!navigator.geolocation) {
                alert("Geolocation is not supported by your browser.");
                window.location.replace('rental.html');
                return;
            }

            document.getElementById('defaultStateContent').style.display = 'none';
            document.getElementById('spinnerStateContent').style.display = 'flex';
            document.getElementById('loadingStatusText').innerText = "Requesting permission...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const coords = { lat: position.coords.latitude, lng: position.coords.longitude };
                    fetchNearbyItems(coords);
                },
                (error) => {
                    document.getElementById('spinnerStateContent').style.display = 'none';
                    document.getElementById('defaultStateContent').style.display = 'block';
                    
                    if (error.code === error.PERMISSION_DENIED) {
                        alert("Location permission was denied. Please allow location access in your device settings.");
                    } else if (error.code === error.POSITION_UNAVAILABLE) {
                        alert("GPS signal is off. Please turn on Location in your device settings.");
                    } else {
                        alert("Unable to retrieve location. Please check your settings.");
                    }
                },
                { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
            );
        };
    </script>
</body>
</html>
