<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hidden Posts Filter</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: #E2E8F0; }
        .posts-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
        .post-grid-item { position: relative; aspect-ratio: 3 / 4; background: #0F172A; overflow: hidden; cursor: pointer; opacity: 0.8; /* Slightly dim hidden items */ }
        .post-grid-item img, .post-grid-item video { width: 100%; height: 100%; object-fit: cover; filter: grayscale(50%); }
        .hidden-badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.6); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; z-index: 2; }
        .post-views-count { position: absolute; bottom: 5px; left: 5px; display: flex; align-items: center; gap: 3px; color: #FFF; font-size: 11px; font-weight: 700; text-shadow: 0 1px 3px rgba(0,0,0,0.8); z-index: 2; }
        .post-views-count svg { width: 12px; height: 12px; fill: currentColor; stroke: none; }
        .empty-grid-msg { grid-column: span 3; text-align: center; padding: 30px 16px; color: #64748B; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <main class="posts-grid" id="postsGridContainer">
        <!-- Content injected by JS -->
    </main>

    <script>
        function renderGrid() {
            const container = document.getElementById('postsGridContainer');
            const parent = window.parent;
            
            if (!parent || !parent.allUserPosts) {
                container.innerHTML = '<div class="empty-grid-msg">Loading...</div>';
                return;
            }

            // Filter explicitly for hidden posts
            const filteredPosts = parent.allUserPosts.filter(post => post.isHidden === true);

            if (filteredPosts.length > 0) {
                container.innerHTML = '';
                const fragment = document.createDocumentFragment();

                filteredPosts.forEach(post => {
                    const views = post.views || post.viewCount || 0;
                    const mediaSrc = (post.images && post.images.length > 0) 
                        ? post.images[0] 
                        : (post.imageUrl || post.image || post.mediaUrl || post.photo || '40789.png');

                    const gridCell = document.createElement('div');
                    gridCell.className = 'post-grid-item';
                    
                    const formatViews = parent.formatCount ? parent.formatCount(views) : views;
                    gridCell.innerHTML = `
                        <div class="hidden-badge">HIDDEN</div>
                        <img src="${mediaSrc}" alt="Post" loading="lazy">
                        <div class="post-views-count"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg><span>${formatViews}</span></div>
                    `;
                    
                    gridCell.addEventListener('click', () => {
                        if (parent.openPreviewModal) parent.openPreviewModal(post);
                    });
                    
                    fragment.appendChild(gridCell);
                });
                container.appendChild(fragment);
            } else {
                container.innerHTML = '<div class="empty-grid-msg">No hidden items found.</div>';
            }
        }

        // Setup listener when loaded
        window.addEventListener('load', () => {
            // Wait briefly to ensure parent has populated window.allUserPosts
            setTimeout(renderGrid, 100);
        });
    </script>
</body>
</html>
