<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hulum - Search Rentals</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="news.css">
    <link rel="stylesheet" href="rental.css">

    <style>
        .search-page-header {
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 50;
            /* Pushes the header down below the system status bar in APKs */
            padding: calc(env(safe-area-inset-top, 25px) + 15px) 20px 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .search-all-btn {
            background: #f1f5f9;
            color: #0F172A;
            border: 1px solid #e2e8f0;
            padding: 9px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            margin-right: 12px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .search-all-btn:active {
            background: #e2e8f0;
            transform: scale(0.96);
        }

        .search-input-wrapper-dedicated {
            flex: 1;
            display: flex;
            align-items: center;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 10px 14px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        .search-input-wrapper-dedicated:focus-within {
            background: #ffffff;
            border-color: #38bdf8;
        }
        .search-input-wrapper-dedicated svg {
            color: #64748b;
            margin-right: 8px;
            width: 20px;
            height: 20px;
        }
        .search-field-dedicated {
            border: none;
            background: transparent;
            width: 100%;
            font-size: 15px;
            font-family: inherit;
            color: #0f172a;
            outline: none;
        }
        .search-results-container {
            padding: 0;
            padding-bottom: 100px;
            min-height: 80vh;
            background: #ffffff;
        }

        .suggestion-list {
            display: flex;
            flex-direction: column;
        }
        .suggestion-item {
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .suggestion-item:active {
            background: #f8fafc;
        }
        .suggestion-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #f1f5f9;
            color: #64748b;
        }
        .suggestion-icon svg {
            width: 16px;
            height: 16px;
        }
        .suggestion-text {
            font-size: 15px;
            font-weight: 600;
            color: #0F172A;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .suggestion-type {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .history-header-row {
            padding: 12px 20px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
        }
        .history-title {
            font-size: 13px;
            font-weight: 800;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .history-clear-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 8px;
        }
        .spinning-loader {
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="app-view">
        <header class="search-page-header">
            <button class="search-all-btn" onclick="goToAllRentals()">All</button>
            <form class="search-input-wrapper-dedicated" id="searchForm" onsubmit="handleSearchSubmit(event)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <circle cx="9.5" cy="9.5" r="5.5"></circle>
                    <line x1="14" y1="14" x2="21" y2="21"></line>
                </svg>
                <input type="text" class="search-field-dedicated" id="mainSearchInput" placeholder="Search database..." autocomplete="off" autofocus>
            </form>
        </header>

        <main class="search-results-container" id="searchResultsArea">
            <!-- Content will be injected by JavaScript -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <a id="nav-rental" href="rental.html" class="nav-item active">
                <div class="icon-bg"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
                <span>Rental</span>
            </a>
            <a id="nav-selling" href="selling.html" class="nav-item">
                <div class="icon-bg"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg></div>
                <span>Selling</span>
            </a>
            <a id="nav-post" href="post.html" class="nav-item-post-center">
                <div class="post-fab-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></div>
                <span class="post-fab-label">Post</span>
            </a>
            <a id="nav-service" href="service.html" class="nav-item">
                <div class="icon-bg"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg></div>
                <span>Service</span>
            </a>
            <a id="nav-profile" href="profile.html" class="nav-item">
                <div class="icon-bg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
                <span>Profile</span>
            </a>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, limitToLast, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXoIY6Q1Cf3Dw0jU5VImIqxchW79OME6Q",
            authDomain: "delala-1b582.firebaseapp.com",
            databaseURL: "https://delala-1b582-default-rtdb.firebaseio.com",
            projectId: "delala-1b582",
            storageBucket: "delala-1b582.firebasestorage.app",
            messagingSenderId: "1073041850834",
            appId: "1:1073041850834:web:fe5d0095c3ff1b238f480b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let searchTermsArray = [];
        let deepSearchTimer = null; 
        const HISTORY_KEY = 'hulum_saved_searches';
        
        const DOM = {
            searchInput: document.getElementById('mainSearchInput'),
            resultsArea: document.getElementById('searchResultsArea'),
            searchForm: document.getElementById('searchForm')
        };

        window.goToAllRentals = function() {
            sessionStorage.removeItem('hulum_rental_cache_v1');
            window.location.href = 'rental.html';
        };

        function getSearchHistory() {
            try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } 
            catch(e) { return []; }
        }

        function saveSearchTerm(term) {
            if (!term) return;
            let history = getSearchHistory();
            history = history.filter(t => t.toLowerCase() !== term.toLowerCase());
            history.unshift(term);
            if (history.length > 15) history.pop();
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        window.clearSearchHistory = function() {
            localStorage.removeItem(HISTORY_KEY);
            loadSearchHistoryOrEmptyState();
        };

        window.executeSearch = function(term) {
            saveSearchTerm(term);
            window.location.href = `rental.html?search=${encodeURIComponent(term)}`;
        };

        function loadSearchHistoryOrEmptyState() {
            const history = getSearchHistory();
            
            if (history.length === 0) {
                DOM.resultsArea.innerHTML = `
                    <div style="text-align:center; padding:60px 20px; color:#64748B;">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" style="margin-bottom:12px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <div style="font-size:16px; font-weight:700; color:#0F172A;">Search everything you want</div>
                        <div style="font-size:13px; margin-top:6px;">Find specific locations, sub-categories, and features.</div>
                    </div>
                `;
                return;
            }

            let html = `
                <div class="history-header-row">
                    <span class="history-title">Recent Searches</span>
                    <button class="history-clear-btn" onclick="clearSearchHistory()">Clear</button>
                </div>
                <div class="suggestion-list">
            `;
            
            history.forEach(term => {
                html += `
                    <div class="suggestion-item" onclick="executeSearch('${term.replace(/'/g, "\\'")}')">
                        <div class="suggestion-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        </div>
                        <span class="suggestion-text">${term}</span>
                    </div>
                `;
            });
            html += '</div>';
            
            DOM.resultsArea.innerHTML = html;
        }

        window.handleSearchSubmit = function(event) {
            event.preventDefault();
            DOM.searchInput.blur();
        };

        DOM.searchInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            
            if (deepSearchTimer) clearTimeout(deepSearchTimer);

            if (val === '') {
                loadSearchHistoryOrEmptyState();
            } else {
                executeLiveSearch(val);
            }
        });

        async function fetchDatabaseForSearch() {
            const nodePaths = ['posts', 'delala_new'];
            const FETCH_LIMIT = 800; 
            const uniqueTermsMap = new Map(); 
            const ignoredWords = ['this', 'that', 'with', 'from', 'your', 'have', 'more', 'will', 'rent', 'rental', 'available', 'good', 'condition'];
            
            try {
                const fetchPromises = nodePaths.map(async (nodePath) => {
                    const dbQuery = query(ref(db, nodePath), limitToLast(FETCH_LIMIT));
                    const snapshot = await get(dbQuery);
                    
                    if (snapshot.exists()) {
                        snapshot.forEach((childSnap) => {
                            const data = childSnap.val();
                            const cat = String(data.category || '').toLowerCase();
                            const rType = String(data.rentalType || '').toLowerCase();
                            
                            if (cat.includes('rent') || rType.length > 0) {
                                if (data.title) uniqueTermsMap.set(data.title.toLowerCase().trim(), { term: data.title.trim(), type: 'Listing' });
                                
                                if (data.subCategory) uniqueTermsMap.set(data.subCategory.toLowerCase().trim(), { term: data.subCategory.trim(), type: 'Sub Category' });
                                if (data.rentalSubCategory && data.rentalSubCategory !== data.subCategory) uniqueTermsMap.set(data.rentalSubCategory.toLowerCase().trim(), { term: data.rentalSubCategory.trim(), type: 'Sub Category' });
                                
                                if (data.city) uniqueTermsMap.set(data.city.toLowerCase().trim(), { term: data.city.trim(), type: 'Location' });
                                if (data.locationDetails) {
                                    if (data.locationDetails.city) uniqueTermsMap.set(data.locationDetails.city.toLowerCase().trim(), { term: data.locationDetails.city.trim(), type: 'Location' });
                                    if (data.locationDetails.subcity) uniqueTermsMap.set(data.locationDetails.subcity.toLowerCase().trim(), { term: data.locationDetails.subcity.trim(), type: 'Location' });
                                    if (data.locationDetails.uniqueName) uniqueTermsMap.set(data.locationDetails.uniqueName.toLowerCase().trim(), { term: data.locationDetails.uniqueName.trim(), type: 'Location' });
                                }

                                if (data.categorySpecificDetails) {
                                    if (data.categorySpecificDetails.guestHouseName) uniqueTermsMap.set(data.categorySpecificDetails.guestHouseName.toLowerCase().trim(), { term: data.categorySpecificDetails.guestHouseName.trim(), type: 'Guest House' });
                                    if (data.categorySpecificDetails.carModel) uniqueTermsMap.set(data.categorySpecificDetails.carModel.toLowerCase().trim(), { term: data.categorySpecificDetails.carModel.trim(), type: 'Vehicle' });
                                }

                                const textToParse = `${data.title || ''} ${data.description || ''} ${data.body || ''}`.toLowerCase();
                                const words = textToParse.match(/\b[a-zA-Z]{4,20}\b/g) || [];
                                words.forEach(word => {
                                    if (!ignoredWords.includes(word) && !uniqueTermsMap.has(word)) {
                                        uniqueTermsMap.set(word, { term: word.charAt(0).toUpperCase() + word.slice(1), type: 'Keyword' });
                                    }
                                });
                            }
                        });
                    }
                });

                await Promise.all(fetchPromises);
                searchTermsArray = Array.from(uniqueTermsMap.values());
            } catch (error) {
                console.error("Database silent fetch failed:", error);
            }
        }

        function getIconForType(type) {
            if (type === 'Location') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>`;
            if (type === 'Sub Category') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>`;
            if (type === 'Keyword') return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"></path></svg>`;
            return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>`; // Listing Default
        }

        function executeLiveSearch(cleanQuery) {
            const matchedTerms = searchTermsArray.filter(item => 
                item.term.toLowerCase().includes(cleanQuery.toLowerCase())
            ).slice(0, 15);

            if (matchedTerms.length === 0) {
                DOM.resultsArea.innerHTML = `
                    <div style="text-align:center; padding:50px 20px; color:#64748B;">
                        <svg class="spinning-loader" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" style="margin-bottom:12px;"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>
                        <div id="deepSearchStatusTitle" style="font-size:14px; font-weight:600; color:#0F172A;">Searching deep in database...</div>
                        <div id="deepSearchStatusDesc" style="font-size:12px; margin-top:4px;">Scanning archives for "${cleanQuery}"</div>
                    </div>
                `;

                deepSearchTimer = setTimeout(() => {
                    const titleEl = document.getElementById('deepSearchStatusTitle');
                    const descEl = document.getElementById('deepSearchStatusDesc');
                    const spinnerEl = document.querySelector('.spinning-loader');
                    
                    if (titleEl && descEl) {
                        if (spinnerEl) spinnerEl.style.display = 'none'; 
                        titleEl.innerText = "Not similar word found in database.";
                        titleEl.style.color = "#ef4444";
                        descEl.innerText = "Please try a different keyword or check your spelling.";
                    }
                }, 40000); 
                
                return;
            }

            let html = '<div class="suggestion-list">';
            matchedTerms.forEach(match => {
                html += `
                    <div class="suggestion-item" onclick="executeSearch('${match.term.replace(/'/g, "\\'")}')">
                        <div class="suggestion-icon">${getIconForType(match.type)}</div>
                        <span class="suggestion-text">${match.term}</span>
                        <span class="suggestion-type">${match.type}</span>
                    </div>
                `;
            });
            html += '</div>';

            DOM.resultsArea.innerHTML = html;
        }

        loadSearchHistoryOrEmptyState();
        fetchDatabaseForSearch();
    </script>
</body>
</html>
