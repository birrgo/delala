<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #1e2228, #2a2f38, #14171a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
    }

    /* Metallic Silver Card Container */
    .card {
      background: linear-gradient(145deg, #323842, #21252b);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 
                  inset 0 1px 1px rgba(255, 255, 255, 0.15);
      border: 1px solid #454c59;
      width: 90%;
      max-width: 420px;
    }

    h2 {
      margin-bottom: 20px;
      color: #e6e6e6;
      text-align: center;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #a0a6b2;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      background-color: #1a1d24;
      border: 1px solid #454c59;
      border-radius: 6px;
      font-size: 16px;
      color: #ffffff;
      outline: none;
    }
    input:focus {
      border-color: #8a99ad;
      box-shadow: 0 0 5px rgba(138, 153, 173, 0.4);
    }

    /* Metallic Silver Buttons */
    button.primary-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(180deg, #5a6270 0%, #3b414a 100%);
      color: #ffffff;
      border: 1px solid #6b7483;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    button.primary-btn:hover {
      background: linear-gradient(180deg, #6b7483 0%, #454c57 100%);
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      text-align: center;
    }
    .error { color: #ff6b6b; }
    .success { color: #51cf66; }

    /* Dashboard Navigation Cards Grid */
    #dashboardView {
      display: none;
      width: 100%;
      max-width: 420px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
      margin-bottom: 25px;
    }

    .nav-card {
      background: linear-gradient(145deg, #2a2f38, #1a1d24);
      border: 1px solid #454c59;
      border-radius: 10px;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      color: #e0e0e0;
    }
    .nav-card:hover {
      border-color: #8a99ad;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.4);
    }
    .nav-card i {
      font-size: 28px;
      margin-bottom: 8px;
      color: #8a99ad;
    }
    .nav-card span {
      font-size: 12px;
      font-weight: bold;
    }

    /* Settings Panel */
    .settings-panel {
      border-top: 1px solid #454c59;
      padding-top: 20px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Login Card -->
  <div class="card" id="loginCard">
    <h2>Admin Login</h2>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter Username" value="ADMIN">
    </div>
    <div class="form-group">
      <label for="pin">PIN</label>
      <input type="password" id="pin" placeholder="Enter PIN" value="1234">
    </div>
    <button class="primary-btn" id="loginBtn">Login</button>
    <div class="message" id="msg"></div>
  </div>

  <!-- Dashboard Container -->
  <div class="card" id="dashboardView">
    <h2>Admin Dashboard</h2>
    
    <!-- Icon Navigation Links -->
    <div class="nav-grid">
      <!-- Settings Icon -->
      <div class="nav-card" onclick="toggleSettings()">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
      </div>

      <!-- Deposits Icon -->
      <a href="deposits.html" class="nav-card">
        <i class="fa-solid fa-wallet"></i>
        <span>Deposits</span>
      </a>

      <!-- Pricing Icon -->
      <a href="price.html" class="nav-card">
        <i class="fa-solid fa-tag"></i>
        <span>Pricing</span>
      </a>
    </div>

    <!-- Account Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
      <h2 style="font-size: 18px; text-align: left; margin-bottom: 15px;">Account Settings</h2>
      <div class="form-group">
        <label for="newUsername">New Username</label>
        <input type="text" id="newUsername" placeholder="Enter New Username">
      </div>
      <div class="form-group">
        <label for="oldPin">Old PIN</label>
        <input type="password" id="oldPin" placeholder="Enter Old PIN">
      </div>
      <div class="form-group">
        <label for="newPin">New PIN</label>
        <input type="password" id="newPin" placeholder="Enter New PIN">
      </div>
      <div class="form-group">
        <label for="confirmPin">Confirm New PIN</label>
        <input type="password" id="confirmPin" placeholder="Confirm New PIN">
      </div>
      <button class="primary-btn" id="saveAccountBtn">Update Credentials</button>
      <div class="message" id="settingsMsg"></div>
    </div>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get, set, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBXoIY6Q1Cf3Dw0jU5VImIqxchW79OME6Q",
      authDomain: "delala-1b582.firebaseapp.com",
      databaseURL: "https://delala-1b582-default-rtdb.firebaseio.com",
      projectId: "delala-1b582",
      storageBucket: "delala-1b582.firebasestorage.app",
      messagingSenderId: "1073041850834",
      appId: "1:1073041850834:web:fe5d0095c3ff1b238f480b",
      measurementId: "G-2XW8F8FKBT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentAdminUser = "ADMIN";
    const DEFAULT_PIN = "1234";

    // Auto-seed default admin credential
    async function seedDefaultAdmin() {
      const adminRef = ref(db, `admin/users/${currentAdminUser}`);
      const snapshot = await get(adminRef);
      if (!snapshot.exists()) {
        await set(adminRef, { pin: DEFAULT_PIN });
      }
    }
    seedDefaultAdmin().catch(console.error);

    // Login logic
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const usernameInput = document.getElementById("username").value.trim();
      const pinInput = document.getElementById("pin").value.trim();
      const msgDiv = document.getElementById("msg");

      if (!usernameInput || !pinInput) {
        msgDiv.className = "message error";
        msgDiv.textContent = "Please fill in all fields.";
        return;
      }

      msgDiv.className = "message";
      msgDiv.textContent = "Verifying credentials...";

      try {
        const userRef = ref(db, `admin/users/${usernameInput}`);
        const snapshot = await get(userRef);

        if (snapshot.exists()) {
          const userData = snapshot.val();
          if (String(userData.pin) === pinInput) {
            currentAdminUser = usernameInput;
            msgDiv.className = "message success";
            msgDiv.textContent = "Login successful!";
            
            setTimeout(() => {
              document.getElementById("loginCard").style.display = "none";
              document.getElementById("dashboardView").style.display = "block";
              document.getElementById("newUsername").value = currentAdminUser;
            }, 500);
          } else {
            msgDiv.className = "message error";
            msgDiv.textContent = "Invalid PIN.";
          }
        } else {
          msgDiv.className = "message error";
          msgDiv.textContent = "Admin user not found.";
        }
      } catch (error) {
        console.error("Database error:", error);
        msgDiv.className = "message error";
        msgDiv.textContent = "Database error. Check console.";
      }
    });

    // Update Username & PIN Logic
    document.getElementById("saveAccountBtn").addEventListener("click", async () => {
      const newUsername = document.getElementById("newUsername").value.trim();
      const oldPin = document.getElementById("oldPin").value.trim();
      const newPin = document.getElementById("newPin").value.trim();
      const confirmPin = document.getElementById("confirmPin").value.trim();
      const settingsMsg = document.getElementById("settingsMsg");

      if (!newUsername || !oldPin || !newPin || !confirmPin) {
        settingsMsg.className = "message error";
        settingsMsg.textContent = "Please fill in all fields.";
        return;
      }

      if (newPin !== confirmPin) {
        settingsMsg.className = "message error";
        settingsMsg.textContent = "New PIN and Confirm PIN do not match.";
        return;
      }

      settingsMsg.className = "message";
      settingsMsg.textContent = "Verifying credentials...";

      try {
        const oldUserRef = ref(db, `admin/users/${currentAdminUser}`);
        const snapshot = await get(oldUserRef);

        if (snapshot.exists()) {
          const userData = snapshot.val();
          
          // Verify old PIN
          if (String(userData.pin) !== oldPin) {
            settingsMsg.className = "message error";
            settingsMsg.textContent = "Incorrect Old PIN.";
            return;
          }

          // If username changed, delete old node first
          if (newUsername !== currentAdminUser) {
            await remove(oldUserRef);
          }

          // Set new username and PIN record in database
          await set(ref(db, `admin/users/${newUsername}`), { pin: newPin });
          currentAdminUser = newUsername;

          settingsMsg.className = "message success";
          settingsMsg.textContent = "Username and PIN updated successfully!";

          // Reset PIN inputs
          document.getElementById("oldPin").value = "";
          document.getElementById("newPin").value = "";
          document.getElementById("confirmPin").value = "";
        } else {
          settingsMsg.className = "message error";
          settingsMsg.textContent = "Current admin user not found in database.";
        }
      } catch (error) {
        console.error("Error updating account settings:", error);
        settingsMsg.className = "message error";
        settingsMsg.textContent = "Failed to update account settings.";
      }
    });

    // Toggle Settings panel visibility
    window.toggleSettings = function() {
      const panel = document.getElementById("settingsPanel");
      panel.style.display = panel.style.display === "none" || panel.style.display === "" ? "block" : "none";
    };
  </script>
</body>
</html>
