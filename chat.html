<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Delala - Messages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --primary-dark: #0F172A;
            --bg-body: #F4F7F9;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --success-color: #34D399;
            --offline-color: #94A3B8;

            /* Premium Silver Dark 3D Variables */
            --silver-grad: linear-gradient(145deg, #64748B, #334155, #0F172A);
            --silver-shadow: inset 0px 2px 2px rgba(255, 255, 255, 0.25), inset 0px -2px 4px rgba(0, 0, 0, 0.5), 0 4px 10px rgba(15, 23, 42, 0.25);
        }

        * { font-family: var(--font-main); box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-body);
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* --- Premium 3D Metallic Header --- */
        .inbox-header {
            background: linear-gradient(145deg, #1E293B, #0F172A);
            padding: 16px;
            display: flex;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(15,23,42,0.25);
            border-bottom: 1px solid #334155;
        }

        /* 3D Inset Search Input Bar */
        .search-input-wrapper-3d {
            width: 100%;
            height: 50px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            padding: 0 6px 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 
                inset 0 2px 6px rgba(0, 0, 0, 0.6),
                0 1px 0 rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .search-input-wrapper-3d:focus-within {
            border-color: #64748B;
            background: rgba(15, 23, 42, 0.8);
            box-shadow: 
                inset 0 2px 8px rgba(0, 0, 0, 0.8),
                0 0 0 2px rgba(100, 116, 139, 0.3);
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 500;
            color: #FFFFFF;
            outline: none;
        }
        .search-input::placeholder { color: #94A3B8; font-weight: 500; letter-spacing: 0.3px; }

        /* Modern 3D Silver Dark Button */
        .btn-icon-3d {
            background: var(--silver-grad);
            border: 1px solid #475569;
            width: 38px; 
            height: 38px;
            border-radius: 12px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            flex-shrink: 0;
            box-shadow: var(--silver-shadow);
        }

        .btn-icon-3d:active {
            transform: translateY(2px) scale(0.95);
            box-shadow: 
                inset 0px 2px 4px rgba(0, 0, 0, 0.6), 
                0 1px 2px rgba(15, 23, 42, 0.2);
        }

        .btn-icon-3d svg { 
            width: 18px; 
            height: 18px; 
            stroke: currentColor; 
            stroke-width: 2.5; 
            fill: none; 
            stroke-linecap: round;
            filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.4));
        }

        /* Search Dropdown */
        .search-results-dropdown {
            position: absolute;
            top: 76px; left: 16px; right: 16px;
            background: #FFF;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            max-height: 280px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 12px 30px rgba(15,23,42,0.15);
            z-index: 25;
            overflow: hidden;
        }
        .search-result-item {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid #F1F5F9;
            transition: background 0.2s;
        }
        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:active { background: #F8FAFC; }
        .search-result-info h4 { font-size: 14px; font-weight: 800; color: var(--primary-dark); }
        .search-result-info p { font-size: 11px; font-weight: 600; color: var(--text-muted); margin-top: 2px; }

        /* Conversations List */
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Premium Chat Cards */
        .chat-item {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 16px rgba(15,23,42,0.03);
            position: relative;
            overflow: hidden;
        }
        
        /* Left Metallic Edge Accent */
        .chat-item::before {
            content: '';
            position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
            background: linear-gradient(180deg, #94A3B8, #334155);
        }

        .chat-item:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(15,23,42,0.02); }

        /* Circular Profile Avatar */
        .chat-item-avatar {
            width: 50px; height: 50px;
            border-radius: 50%; 
            background: var(--silver-grad);
            box-shadow: var(--silver-shadow);
            border: 2px solid #FFFFFF;
            color: #FFFFFF;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 18px;
            flex-shrink: 0;
            position: relative;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .chat-item-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        /* Glowing Online Indicator */
        .online-dot {
            position: absolute; bottom: 0px; right: 0px; width: 14px; height: 14px;
            background: var(--success-color); border: 2px solid #FFFFFF; border-radius: 50%;
            box-shadow: 0 2px 4px rgba(52, 211, 153, 0.4);
            z-index: 2;
        }
        .online-dot.offline { 
            background: var(--offline-color); 
            box-shadow: none; 
        }

        .chat-item-info { flex: 1; min-width: 0; }
        .chat-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .chat-item-top h3 { 
            font-size: 15px; 
            font-weight: 800; 
            color: var(--primary-dark); 
            letter-spacing: -0.2px; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .username-preview { 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-muted); 
            text-transform: lowercase; 
        }
        .chat-item-top span { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; flex-shrink: 0; }
        
        .chat-item-msg { 
            font-size: 13px; 
            font-weight: 500;
            color: #475569; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            opacity: 0.9;
        }

        /* Premium Empty State */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .empty-icon {
            width: 64px; height: 64px; 
            background: var(--silver-grad); 
            color: #FFFFFF;
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            margin-bottom: 16px;
            box-shadow: var(--silver-shadow);
            border: 2px solid #FFFFFF;
        }
        .empty-icon svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 2.5; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4)); }
        .empty-state h3 { font-size: 16px; font-weight: 800; color: var(--primary-dark); margin-bottom: 6px; }
        .empty-state p { font-size: 12px; font-weight: 600; color: var(--text-muted); line-height: 1.5; max-width: 240px; }
        
        /* Auth Button inside empty state */
        .auth-btn-primary { width: 100%; max-width: 240px; background: #0F172A; color: #FFF; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-block; margin-top: 15px; box-shadow: 0 4px 12px rgba(15,23,42,0.15); }
    </style>
</head>
<body>

    <div id="inboxScreen" class="screen">
        <!-- Always-On Top Full Header Search Bar -->
        <header class="inbox-header">
            <div class="search-input-wrapper-3d">
                <input type="text" id="userSearchInput" class="search-input" placeholder="Search by username or phone...">
                <button class="btn-icon-3d" id="btnSearchTrigger" title="Search">
                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.55" y2="16.55"></line>
                    </svg>
                </button>
            </div>
        </header>

        <div id="searchResultsDropdown" class="search-results-dropdown"></div>

        <div id="conversationsContainer" class="conversations-list"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBXoIY6Q1Cf3Dw0jU5VImIqxchW79OME6Q",
            authDomain: "delala-1b582.firebaseapp.com",
            databaseURL: "https://delala-1b582-default-rtdb.firebaseio.com",
            projectId: "delala-1b582",
            storageBucket: "delala-1b582.firebasestorage.app",
            messagingSenderId: "1073041850834",
            appId: "1:1073041850834:web:fe5d0095c3ff1b238f480b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        const conversationsContainer = document.getElementById('conversationsContainer');
        const userSearchInput = document.getElementById('userSearchInput');
        const btnSearchTrigger = document.getElementById('btnSearchTrigger');
        const searchResultsDropdown = document.getElementById('searchResultsDropdown');

        btnSearchTrigger.onclick = () => { userSearchInput.focus(); };

        // --- AUTHENTICATION SYNC FIX ---
        // This makes the chat detect login EXACTLY like your profile.html does
        function getActiveUserId(firebaseUser) {
            if (firebaseUser) return firebaseUser.uid;
            
            // Check for custom login session (your phone login system)
            const sessionPhone = localStorage.getItem('auth_session_phone');
            if (sessionPhone && localStorage.getItem('user_logged_out') !== 'true') {
                return sessionPhone.replace(/\D/g, '').replace(/^0+/, '');
            }
            
            return null;
        }

        // Evaluate Auth State based on Firebase AND LocalStorage
        function evaluateAuthState(user) {
            const myUserId = getActiveUserId(user);

            if (myUserId) {
                setupRealtimePresence(myUserId);
                loadConversations(myUserId);
                setupSearch(myUserId);
            } else {
                conversationsContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </div>
                        <h3>Not Logged In</h3>
                        <p>Please log in to view your messages and chat with others.</p>
                        <a href="login.html" class="auth-btn-primary">Sign in to Delala</a>
                    </div>
                `;
            }
        }

        auth.onAuthStateChanged(evaluateAuthState);

        // Also listen for changes to localStorage (in case they log in on another tab)
        window.addEventListener('storage', (e) => {
            if (e.key === 'auth_session_phone' || e.key === 'user_logged_out') {
                evaluateAuthState(auth.currentUser);
            }
        });

        function setupRealtimePresence(myUserId) {
            const myPresenceRef = db.ref(`users/${myUserId}/presence`);
            const connectedRef = db.ref('.info/connected');

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    myPresenceRef.onDisconnect().set({
                        isOnline: false,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });

                    myPresenceRef.set({
                        isOnline: true,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            });
        }

        function loadConversations(myUserId) {
            db.ref(`user_chats/${myUserId}`).on('value', (snapshot) => {
                const myChats = snapshot.val();
                conversationsContainer.innerHTML = '';

                if (!myChats || Object.keys(myChats).length === 0) {
                    conversationsContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            </div>
                            <h3>No Conversations</h3>
                            <p>Search by username or phone number above to start messaging.</p>
                        </div>
                    `;
                    return;
                }

                const sortedChats = Object.keys(myChats).map(otherUserId => {
                    return {
                        otherUserId: otherUserId,
                        ...myChats[otherUserId]
                    };
                }).sort((a, b) => b.timestamp - a.timestamp);

                sortedChats.forEach(chatInfo => {
                    const userId = chatInfo.otherUserId;

                    db.ref(`users/${userId}`).once('value', (uSnap) => {
                        const userData = uSnap.val() || {};
                        const displayName = userData.displayName || userData.fullName || userId;
                        const username = userData.username ? `@${userData.username}` : '';
                        const photoURL = userData.photoURL || userData.profilePicture || '';
                        
                        const initial = displayName.charAt(0).toUpperCase();
                        const isOnline = userData.presence ? userData.presence.isOnline : false;

                        const avatarContent = photoURL 
                            ? `<img src="${photoURL}" alt="${displayName}">` 
                            : initial;

                        const item = document.createElement('div');
                        item.className = 'chat-item';
                        item.onclick = () => openChatPage(userId, displayName);
                        item.innerHTML = `
                            <div class="chat-item-avatar">
                                ${avatarContent}
                                <div class="online-dot ${isOnline ? '' : 'offline'}"></div>
                            </div>
                            <div class="chat-item-info">
                                <div class="chat-item-top">
                                    <h3>${displayName} <span class="username-preview">${username}</span></h3>
                                    <span>${formatTime(chatInfo.timestamp)}</span>
                                </div>
                                <div class="chat-item-msg">${(chatInfo.lastMessage && chatInfo.lastMessage.includes('location')) ? '📍 Shared Location' : (chatInfo.lastMessage || '')}</div>
                            </div>
                        `;
                        conversationsContainer.appendChild(item);
                    });
                });
            });
        }

        function setupSearch(myUserId) {
            userSearchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim().toLowerCase();
                if(!query) { searchResultsDropdown.style.display = 'none'; return; }

                db.ref('users').once('value', (snapshot) => {
                    const users = snapshot.val();
                    searchResultsDropdown.innerHTML = '';
                    if(!users) { searchResultsDropdown.style.display = 'none'; return; }

                    let matches = 0;
                    Object.keys(users).forEach(userId => {
                        // Skip the currently logged-in user so they can't search themselves
                        if (userId === myUserId) return; 

                        const u = users[userId];
                        const phone = (u.cleanPhone || u.phone || '').toLowerCase();
                        const username = (u.username || '').toLowerCase();

                        if((phone && phone.includes(query)) || (username && username.includes(query))) {
                            matches++;
                            
                            const displayName = u.displayName || u.fullName || userId;
                            const displayUsername = username ? `@${u.username}` : '';
                            const photoURL = u.photoURL || u.profilePicture || '';
                            const avatarContent = photoURL 
                                ? `<img src="${photoURL}" alt="${displayName}">` 
                                : displayName.charAt(0).toUpperCase();

                            const resItem = document.createElement('div');
                            resItem.className = 'search-result-item';
                            resItem.onclick = () => {
                                searchResultsDropdown.style.display = 'none';
                                userSearchInput.value = '';
                                openChatPage(userId, displayName);
                            };
                            resItem.innerHTML = `
                                <div class="chat-item-avatar" style="width:40px;height:40px;font-size:15px;border-width:1px;">
                                    ${avatarContent}
                                </div>
                                <div class="search-result-info">
                                    <h4>${displayName}</h4>
                                    <p>${displayUsername || phone}</p>
                                </div>
                            `;
                            searchResultsDropdown.appendChild(resItem);
                        }
                    });
                    searchResultsDropdown.style.display = matches > 0 ? 'block' : 'none';
                });
            });
        }

        function formatTime(ts) {
            if(!ts) return '';
            return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function openChatPage(userId, userName) {
            const targetUrl = `chat1.html?userId=${encodeURIComponent(userId)}&userName=${encodeURIComponent(userName)}`;
            window.location.href = targetUrl;
        }

    </script>
</body>
</html>
