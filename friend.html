<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loading</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f8fafc;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.2) 0%, transparent 40%);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            text-align: center; 
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            z-index: 0;
        }

        .loading-container { 
            position: relative;
            z-index: 1;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 24px; 
            background: linear-gradient(145deg, #0F2C59, #081B38);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px 60px;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(8, 27, 56, 0.2), 
                        0 0 0 4px rgba(255, 255, 255, 0.4) inset;
        }

        .spinner { 
            width: 44px; 
            height: 44px; 
            border: 3px solid rgba(16, 185, 129, 0.15); 
            border-top-color: #10B981; 
            border-bottom-color: #10B981;
            border-radius: 50%; 
            animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; 
            position: relative;
        }
        
        .spinner::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px; right: -3px; bottom: -3px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-left-color: rgba(56, 189, 248, 0.8);
            border-right-color: rgba(56, 189, 248, 0.8);
            animation: spin-reverse 1.8s linear infinite;
        }

        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
        
        @keyframes spin-reverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        .info-text { 
            font-size: 15px; 
            font-weight: 600; 
            color: #ffffff; 
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            opacity: 0.95;
        }

        .dots::after {
            content: '';
            display: inline-block;
            width: 1em;
            text-align: left;
            animation: ellipsis 1.5s infinite steps(4, end);
        }

        @keyframes ellipsis {
            0% { content: ''; }
            25% { content: '.'; }
            50% { content: '..'; }
            75% { content: '...'; }
            100% { content: ''; }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <div class="info-text" id="statusText">Loading<span class="dots"></span></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, get, orderByChild, equalTo, limitToLast } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXoIY6Q1Cf3Dw0jU5VImIqxchW79OME6Q",
            authDomain: "delala-1b582.firebaseapp.com",
            databaseURL: "https://delala-1b582-default-rtdb.firebaseio.com",
            projectId: "delala-1b582",
            storageBucket: "delala-1b582.firebasestorage.app",
            messagingSenderId: "1073041850834",
            appId: "1:1073041850834:web:fe5d0095c3ff1b238f480b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        function isRentalCategory(item) {
            if (!item) return false;
            const rType = String(item.rentalType || '').trim().toLowerCase();
            const cat = String(item.category || '').trim().toLowerCase();
            return rType.length > 0 || cat.includes('rental') || cat.includes('rent');
        }

        async function fetchNetworkPosts(userId) {
            try {
                // 1. Thoroughly search for the user's following list in all possible database nodes
                let followingList = [];
                const followingSnap = await get(ref(db, `following/${userId}`));
                
                if (followingSnap.exists()) {
                    followingList = Object.keys(followingSnap.val());
                } else {
                    const userSnap = await get(ref(db, `users/${userId}`));
                    if (userSnap.exists()) {
                        const uData = userSnap.val();
                        if (uData.following && typeof uData.following === 'object') followingList = Object.keys(uData.following);
                        else if (uData.following_list && typeof uData.following_list === 'object') followingList = Object.keys(uData.following_list);
                        else if (uData._realFollowingList && typeof uData._realFollowingList === 'object') followingList = Object.keys(uData._realFollowingList);
                    }
                }
                
                followingList = followingList.map(String); // Normalize IDs to string

                if (followingList.length === 0) {
                    sessionStorage.setItem('hulum_external_filter', JSON.stringify({ filter: 'friend', items: [] }));
                    window.location.replace('rental.html');
                    return;
                }

                document.getElementById('statusText').innerHTML = 'Loading<span class="dots"></span>';
                const nodePaths = ['posts', 'delala_new'];
                const matchingItems = [];
                const seenIds = new Set();
                const promises = [];

                // 2. Safely attempt to query Firebase (catching errors if indexing rules block it)
                for (const nodePath of nodePaths) {
                    for (const friendId of followingList) {
                        const qUserId = query(ref(db, nodePath), orderByChild('userId'), equalTo(friendId), limitToLast(20));
                        promises.push(get(qUserId).then(snap => ({ snap, nodePath })).catch(() => null));
                        
                        const qUid = query(ref(db, nodePath), orderByChild('uid'), equalTo(friendId), limitToLast(20));
                        promises.push(get(qUid).then(snap => ({ snap, nodePath })).catch(() => null));
                        
                        const qPostedBy = query(ref(db, nodePath), orderByChild('postedBy'), equalTo(friendId), limitToLast(20));
                        promises.push(get(qPostedBy).then(snap => ({ snap, nodePath })).catch(() => null));
                    }
                }

                const results = await Promise.all(promises);
                results.forEach(res => {
                    if (res && res.snap && res.snap.exists()) {
                        res.snap.forEach(childSnap => {
                            const rawItem = { id: childSnap.key, _dbPath: res.nodePath, ...childSnap.val() };
                            if (!seenIds.has(rawItem.id) && isRentalCategory(rawItem)) {
                                matchingItems.push(rawItem);
                                seenIds.add(rawItem.id);
                            }
                        });
                    }
                });

                // 3. FALLBACK: If queries failed (empty), manually pull recent posts and force-filter them in memory
                if (matchingItems.length === 0) {
                    for (const nodePath of nodePaths) {
                        const fallbackQ = query(ref(db, nodePath), limitToLast(150));
                        const snap = await get(fallbackQ).catch(() => null);
                        if (snap && snap.exists()) {
                            snap.forEach(childSnap => {
                                const rawItem = { id: childSnap.key, _dbPath: nodePath, ...childSnap.val() };
                                const authorId = String(rawItem.userId || rawItem.uid || rawItem.postedBy || '');
                                
                                // STRICT ENFORCEMENT: Only allow if author is in following list
                                if (followingList.includes(authorId) && !seenIds.has(rawItem.id) && isRentalCategory(rawItem)) {
                                    matchingItems.push(rawItem);
                                    seenIds.add(rawItem.id);
                                }
                            });
                        }
                    }
                }

                matchingItems.sort((a, b) => (b.createdAt || b.timestamp || 0) - (a.createdAt || a.timestamp || 0));
                
                sessionStorage.setItem('hulum_external_filter', JSON.stringify({ filter: 'friend', items: matchingItems }));
                window.location.replace('rental.html');

            } catch (error) {
                // If anything catastrophically fails, enforce empty list so you don't see everyone's posts
                sessionStorage.setItem('hulum_external_filter', JSON.stringify({ filter: 'friend', items: [] }));
                window.location.replace('rental.html');
            }
        }

        window.onload = function() {
            const isUserLoggedOut = localStorage.getItem('user_logged_out') === 'true';
            const sessionPhone = localStorage.getItem('auth_session_phone');

            if (!isUserLoggedOut && sessionPhone) {
                fetchNetworkPosts(String(sessionPhone).replace(/\D/g, '').replace(/^0+/, ''));
            } else {
                onAuthStateChanged(auth, (user) => {
                    if (user && !isUserLoggedOut) {
                        fetchNetworkPosts(user.uid);
                    } else {
                        sessionStorage.setItem('hulum_external_filter', JSON.stringify({ filter: 'friend', items: [] }));
                        window.location.replace('rental.html');
                    }
                });
            }
        };
    </script>
</body>
</html>
