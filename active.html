<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Delala - Activity & Notifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F4F7F9; /* Slightly deeper to make silver pop */
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
            --primary-blue: #60A5FA;
            --accent-green: #34D399;
            --accent-red: #F87171;
            --accent-yellow: #FBBF24;
            
            /* Premium Silver Dark 3D Variables */
            --silver-grad: linear-gradient(145deg, #64748B, #334155, #0F172A);
            --silver-shadow: inset 0px 2px 2px rgba(255, 255, 255, 0.25), inset 0px -2px 4px rgba(0, 0, 0, 0.5), 0 4px 10px rgba(15, 23, 42, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--bg-body); color: var(--text-dark); min-height: 100vh; padding-bottom: 40px; }

        /* Premium 3D Header */
        .track-header {
            padding: 16px;
            background: linear-gradient(145deg, #1E293B, #0F172A);
            box-shadow: 0 4px 15px rgba(15,23,42,0.2);
            color: #FFF;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky; top: 0; z-index: 20;
            border-bottom: 1px solid #334155;
        }
        .back-btn { background: none; border: none; color: #FFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 6px; border-radius: 50%; transition: background 0.2s; }
        .back-btn:active { background: rgba(255,255,255,0.1); }
        .back-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .track-header h1 { font-size: 18px; font-weight: 800; margin: 0; letter-spacing: -0.3px; }

        /* Tabs / Toggle */
        .view-toggle-container {
            position: sticky;
            top: 61px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            gap: 10px;
        }
        .toggle-btn {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-light);
            background: #F8FAFC;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .toggle-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; }
        
        /* 3D Silver Dark Active State */
        .toggle-btn.active {
            background: var(--silver-grad);
            box-shadow: var(--silver-shadow);
            color: #FFF;
            border-color: #1E293B;
            transform: translateY(-2px);
        }

        /* View Sections */
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        /* 3D Silver Icons for Cards */
        .icon-3d-silver {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: var(--silver-grad);
            box-shadow: var(--silver-shadow);
            border: 1px solid #334155;
        }
        .icon-3d-silver svg { width: 20px; height: 20px; stroke-width: 2.5; fill: none; }
        
        /* Colored Glowing Strokes on Silver */
        .stroke-blue { stroke: var(--primary-blue); }
        .stroke-red { stroke: var(--accent-red); }
        .stroke-yellow { stroke: var(--accent-yellow); }
        .stroke-green { stroke: var(--accent-green); }

        /* NOTIFICATIONS VIEW */
        .notifications-list { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .notification-card {
            background: #FFF;
            border-radius: 20px;
            padding: 16px;
            border: 1px solid var(--border-light);
            box-shadow: 0 6px 16px rgba(15,23,42,0.03);
            display: flex;
            align-items: flex-start;
            gap: 14px;
            position: relative;
            overflow: hidden;
        }
        /* Top Metallic Edge Accent */
        .notification-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #94A3B8, #334155);
        }

        .notif-content { flex: 1; font-size: 13.5px; color: #334155; line-height: 1.5; }
        .notif-content strong { color: var(--text-dark); font-weight: 800; }
        .notif-post-title { font-weight: 800; color: #1E293B; }
        .notif-time { font-size: 11px; font-weight: 700; color: #94A3B8; margin-top: 6px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        .notif-quote { margin-top: 8px; padding: 10px 14px; background: #F8FAFC; border-left: 4px solid #475569; border-radius: 6px 12px 12px 6px; font-size: 12.5px; color: #475569; font-weight: 500; font-style: italic; }

        /* STATS OVERVIEW VIEW */
        .dashboard-overview { padding: 16px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .overview-card {
            background: #FFF;
            border-radius: 20px;
            padding: 18px;
            border: 1px solid var(--border-light);
            box-shadow: 0 6px 16px rgba(15,23,42,0.03);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        .overview-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #94A3B8, #334155);
        }
        
        .overview-val { font-size: 24px; font-weight: 800; color: var(--text-dark); line-height: 1; margin-top: 4px; }
        .overview-label { font-size: 11px; font-weight: 800; color: #64748B; text-transform: uppercase; letter-spacing: 0.5px; }

        .feed-header { padding: 8px 16px; font-size: 15px; font-weight: 800; color: var(--text-dark); }
        .activity-feed-list { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 14px; }

        .activity-card {
            background: #FFF;
            border-radius: 20px;
            border: 1px solid var(--border-light);
            padding: 18px;
            box-shadow: 0 6px 16px rgba(15,23,42,0.03);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .activity-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .item-title-wrapper { display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .item-title { font-size: 15px; font-weight: 800; color: var(--text-dark); line-height: 1.3; }
        .item-date { font-size: 11px; font-weight: 700; color: #94A3B8; text-transform: uppercase; }
        .item-category { font-size: 10px; font-weight: 800; background: var(--silver-grad); color: #FFF; padding: 4px 10px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 2px 6px rgba(15,23,42,0.2); }

        .activity-stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: #F8FAFC;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid var(--border-light);
        }

        .stat-group { display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .stat-icon { color: #64748B; }
        .stat-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; }
        .stat-num { font-size: 14px; font-weight: 800; color: var(--text-dark); }
        
        .empty-state { text-align:center; padding:50px 20px; color:#64748B; font-size:14px; font-weight:700; background:#FFF; border-radius:20px; border:1px solid #E2E8F0; box-shadow: 0 6px 16px rgba(15,23,42,0.03); }
    </style>
</head>
<body>

    <!-- Professional 3D Header -->
    <header class="track-header">
        <button class="back-btn" onclick="window.history.back()">
            <svg viewBox="0 0 24 24"><path d="M19 12H5"></path><polyline points="12 19 5 12 12 5"></polyline></svg>
        </button>
        <h1>Activity Hub</h1>
    </header>

    <!-- Tabs Toggle -->
    <div class="view-toggle-container">
        <button class="toggle-btn active" data-target="notificationsView">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            Notifications
        </button>
        <button class="toggle-btn" data-target="statsView">
            <svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4"></path><path d="M3 15h6v6H3z"></path><path d="M13 15h6v6h-6z"></path></svg>
            All Stats
        </button>
    </div>

    <!-- VIEW 1: NOTIFICATIONS (Default) -->
    <div id="notificationsView" class="view-section active">
        <main class="notifications-list" id="notificationsFeed">
            <div class="empty-state">Loading notifications...</div>
        </main>
    </div>

    <!-- VIEW 2: ALL STATS (Preview Dashboard) -->
    <div id="statsView" class="view-section">
        <!-- Global Overview -->
        <section class="dashboard-overview">
            <div class="overview-card">
                <div class="icon-3d-silver"><svg class="stroke-blue" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
                <div class="overview-val" id="totalViews">0</div>
                <div class="overview-label">Total Views</div>
            </div>
            <div class="overview-card">
                <div class="icon-3d-silver"><svg class="stroke-red" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>
                <div class="overview-val" id="totalLikes">0</div>
                <div class="overview-label">Total Likes</div>
            </div>
            <div class="overview-card">
                <div class="icon-3d-silver"><svg class="stroke-yellow" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
                <div class="overview-val" id="avgRating">0.0</div>
                <div class="overview-label">Avg Rating</div>
            </div>
            <div class="overview-card">
                <div class="icon-3d-silver"><svg class="stroke-green" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></div>
                <div class="overview-val" id="totalComments">0</div>
                <div class="overview-label">Comments</div>
            </div>
        </section>

        <div class="feed-header">
            <span>Listing Breakdown</span>
        </div>

        <main class="activity-feed-list" id="activityFeed">
            <div class="empty-state">Loading activity data...</div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBXoIY6Q1Cf3Dw0jU5VImIqxchW79OME6Q", 
            authDomain: "delala-1b582.firebaseapp.com", 
            databaseURL: "https://delala-1b582-default-rtdb.firebaseio.com", 
            projectId: "delala-1b582", 
            storageBucket: "delala-1b582.firebasestorage.app", 
            messagingSenderId: "1073041850834", 
            appId: "1:1073041850834:web:fe5d0095c3ff1b238f480b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentActiveUserId = null;

        // --- Tabs Logic ---
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
                
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });

        // --- Utility Functions ---
        function formatCount(num) {
            const val = parseInt(num) || 0;
            if (val >= 1000000) return (val / 1000000).toFixed(1) + 'M';
            if (val >= 1000) return (val / 1000).toFixed(1) + 'K';
            return val;
        }

        function timeAgo(timestamp) {
            if (!timestamp) return 'Recently';
            const seconds = Math.floor((new Date() - new Date(timestamp)) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "y ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "mo ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "d ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "h ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m ago";
            return "Just now";
        }

        // --- Core Data Fetching ---
        function listenActivityMetrics(userId) {
            const postsRef = ref(db, 'posts');
            onValue(postsRef, (snapshot) => {
                const itemsList = [];
                const masterNotifications = [];
                let globalViews = 0, globalLikes = 0, globalComments = 0, totalRatingSum = 0, ratedPostsCount = 0;

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        const postOwnerId = String(item.userId || item.uid || item.postedByPhone || item.phone || '').replace(/\D/g, '').replace(/^0+/, '');
                        const cleanCurrentId = String(userId).replace(/\D/g, '').replace(/^0+/, '');

                        if (postOwnerId === cleanCurrentId || String(item.userId) === String(userId)) {
                            itemsList.push({ id: key, ...item });
                            
                            // Aggregate Global Stats
                            globalViews += (parseInt(item.views || item.viewCount) || 0);
                            globalLikes += (parseInt(item.likes || item.likesCount) || 0);
                            
                            const postTitle = item.title || 'Untitled Listing';

                            // Aggregate Comments
                            if (item.comments) {
                                Object.values(item.comments).forEach(c => {
                                    globalComments++;
                                    masterNotifications.push({ type: 'comment', user: c.userName || 'Someone', text: c.text, time: c.timestamp, post: postTitle });
                                });
                            }

                            // Aggregate Ratings
                            if (item.ratings) {
                                Object.values(item.ratings).forEach(r => {
                                    const rVal = r.rating || r.value;
                                    masterNotifications.push({ type: 'rating', user: r.userName || 'Someone', val: rVal, time: r.timestamp, post: postTitle });
                                });
                            }

                            // Calculate Overall Average Rating
                            if (item.averageRating && parseFloat(item.averageRating) > 0) {
                                totalRatingSum += parseFloat(item.averageRating);
                                ratedPostsCount++;
                            }

                            // Aggregate Likes 
                            if (item.likedBy) {
                                Object.keys(item.likedBy).forEach(likerId => {
                                    masterNotifications.push({ type: 'like', user: 'Someone', time: item.createdAt || Date.now(), post: postTitle });
                                });
                            }
                        }
                    });
                }

                document.getElementById('totalViews').innerText = formatCount(globalViews);
                document.getElementById('totalLikes').innerText = formatCount(globalLikes);
                document.getElementById('totalComments').innerText = formatCount(globalComments);
                document.getElementById('avgRating').innerText = ratedPostsCount > 0 ? (totalRatingSum / ratedPostsCount).toFixed(1) : '0.0';

                renderNotifications(masterNotifications);
                renderActivityFeed(itemsList);
            });
        }

        // --- Render Views ---
        function renderNotifications(notifications) {
            const container = document.getElementById('notificationsFeed');
            container.innerHTML = '';

            if (notifications.length === 0) {
                container.innerHTML = `<div class="empty-state">No recent activity on your posts yet.</div>`;
                return;
            }

            notifications.sort((a,b) => (b.time || 0) - (a.time || 0));

            notifications.forEach(notif => {
                const card = document.createElement('div');
                card.className = 'notification-card';

                if (notif.type === 'like') {
                    card.innerHTML = `
                        <div class="icon-3d-silver"><svg class="stroke-red" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>
                        <div class="notif-content">
                            <strong>${notif.user}</strong> liked your post <span class="notif-post-title">"${notif.post}"</span>.
                            <span class="notif-time">${timeAgo(notif.time)}</span>
                        </div>
                    `;
                } else if (notif.type === 'rating') {
                    card.innerHTML = `
                        <div class="icon-3d-silver"><svg class="stroke-yellow" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
                        <div class="notif-content">
                            <strong>${notif.user}</strong> rated your post <span class="notif-post-title">"${notif.post}"</span> <strong>${notif.val} Stars</strong>.
                            <span class="notif-time">${timeAgo(notif.time)}</span>
                        </div>
                    `;
                } else if (notif.type === 'comment') {
                    card.innerHTML = `
                        <div class="icon-3d-silver"><svg class="stroke-blue" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></div>
                        <div class="notif-content">
                            <strong>${notif.user}</strong> commented on <span class="notif-post-title">"${notif.post}"</span>.
                            <div class="notif-quote">"${notif.text}"</div>
                            <span class="notif-time">${timeAgo(notif.time)}</span>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
        }

        function renderActivityFeed(items) {
            const container = document.getElementById('activityFeed');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<div class="empty-state">Post an item to see metrics!</div>`;
                return;
            }

            items.sort((a,b) => (b.timestamp || b.createdAt || 0) - (a.timestamp || a.createdAt || 0));

            items.forEach(item => {
                const commentCount = item.comments ? Object.keys(item.comments).length : 0;
                
                const card = document.createElement('div');
                card.className = 'activity-card';
                card.innerHTML = `
                    <div class="activity-card-header">
                        <div class="item-title-wrapper">
                            <span class="item-title">${item.title || 'Untitled Listing'}</span>
                            <span class="item-date">Posted ${timeAgo(item.timestamp || item.createdAt)}</span>
                        </div>
                        <span class="item-category">${item.category || item.rentalType || 'Listing'}</span>
                    </div>
                    
                    <div class="activity-stats-row">
                        <div class="stat-group">
                            <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
                            <span class="stat-num">${formatCount(item.views || item.viewCount || 0)}</span>
                        </div>
                        <div class="stat-group">
                            <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>
                            <span class="stat-num">${formatCount(item.likes || item.likesCount || 0)}</span>
                        </div>
                        <div class="stat-group">
                            <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></div>
                            <span class="stat-num">${formatCount(commentCount)}</span>
                        </div>
                        <div class="stat-group">
                            <div class="stat-icon"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
                            <span class="stat-num">${item.averageRating ? parseFloat(item.averageRating).toFixed(1) : '0.0'}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // --- Initialize Auth ---
        onAuthStateChanged(auth, (user) => {
            const sessionPhone = localStorage.getItem('auth_session_phone');
            if (user) {
                currentActiveUserId = user.uid;
                listenActivityMetrics(currentActiveUserId);
            } else if (sessionPhone) {
                currentActiveUserId = sessionPhone.replace(/^0+/, '');
                listenActivityMetrics(currentActiveUserId);
            } else {
                document.getElementById('notificationsFeed').innerHTML = `<div class="empty-state">Please log in to view your activity tracking.</div>`;
                document.getElementById('activityFeed').innerHTML = `<div class="empty-state">Please log in to view your activity tracking.</div>`;
            }
        });
    </script>
</body>
</html>
