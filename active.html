<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Delala - Activity & Notifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F8FAFC; 
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-light: #E2E8F0;
            --primary-blue: #2563EB;
            --card-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background: var(--bg-body); color: var(--text-dark); min-height: 100vh; padding-bottom: 24px; }

        /* Combined Sticky Header Wrapper */
        .sticky-top-container {
            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* Top Header with Safe Area Spacing & Back Navigation */
        .track-header {
            padding-top: calc(10px + env(safe-area-inset-top, 0px));
            padding-bottom: 10px;
            padding-left: 12px;
            padding-right: 12px;
            background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 60%, #1E40AF 100%);
            border-bottom: 1px solid #1E293B;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.2);
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: #FFF;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 8px;
            transition: background 0.2s ease;
            width: 32px;
            height: 32px;
        }
        .back-btn:active { background: rgba(255, 255, 255, 0.15); }
        .back-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2.2; }

        .track-header h1 { 
            font-size: 15px; 
            font-weight: 700; 
            margin: 0; 
            letter-spacing: -0.2px; 
            text-align: center;
            flex: 1;
        }

        .header-spacer { width: 32px; }

        /* Tabs Navigation (Compact) */
        .view-toggle-container {
            background: rgba(248, 250, 252, 0.95);
            backdrop-filter: blur(12px);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-light);
            display: flex; 
            gap: 8px;
        }
        
        .toggle-btn {
            flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border-light);
            background: #FFF; font-size: 12px; font-weight: 700; color: var(--text-muted);
            cursor: pointer; transition: all 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .toggle-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; }
        
        .toggle-btn.active {
            background: #1E3A8A; color: #FFF;
            border-color: #1E3A8A; box-shadow: 0 3px 10px rgba(30, 58, 138, 0.2);
        }

        /* View Sections */
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

        /* Compact Dynamic Image Avatar */
        .avatar-frame {
            width: 36px; height: 36px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            background: #F1F5F9; overflow: hidden;
            border: 1px solid var(--border-light);
        }
        .avatar-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        .avatar-frame svg { width: 18px; height: 18px; stroke-width: 2.2; fill: none; }
        .bg-blue { background: #DBEAFE; color: #2563EB; }
        .bg-red { background: #FEE2E2; color: #DC2626; }
        .bg-yellow { background: #FEF3C7; color: #D97706; }
        .bg-green { background: #D1FAE5; color: #059669; }
        .bg-purple { background: #E0E7FF; color: #4F46E5; }

        /* NOTIFICATIONS VIEW */
        .notifications-list { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .notification-card {
            background: #FFF; border-radius: 12px; padding: 10px 12px;
            border: 1px solid var(--border-light); 
            border-left: 3px solid #1E3A8A;
            box-shadow: var(--card-shadow);
            display: flex; align-items: center; gap: 10px;
        }

        .notif-content { flex: 1; font-size: 12.5px; color: #334155; line-height: 1.35; }
        .notif-content strong { color: var(--text-dark); font-weight: 700; }
        .notif-time { font-size: 10px; font-weight: 600; color: #94A3B8; margin-top: 3px; display: block; }
        .notif-quote { margin-top: 5px; padding: 6px 8px; background: #F8FAFC; border-left: 2px solid #3B82F6; border-radius: 4px; font-size: 12px; color: #334155; font-style: italic; }

        /* DASHBOARD VIEW */
        .dashboard-overview { padding: 12px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .overview-card {
            background: #FFF; border-radius: 12px; padding: 10px 12px;
            border: 1px solid var(--border-light); box-shadow: var(--card-shadow);
            display: flex; flex-direction: column; gap: 4px;
        }
        
        .overview-val { font-size: 18px; font-weight: 800; color: var(--text-dark); line-height: 1; margin-top: 2px; }
        .overview-label { font-size: 10px; font-weight: 700; color: #64748B; text-transform: uppercase; letter-spacing: 0.4px; }

        .feed-header { padding: 4px 12px 6px; font-size: 11px; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
        .activity-feed-list { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }

        .activity-card {
            background: #FFF; border-radius: 12px; border: 1px solid var(--border-light);
            padding: 10px 12px; box-shadow: var(--card-shadow);
            display: flex; flex-direction: column; gap: 8px;
        }

        .activity-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .item-title-wrapper { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .item-title { font-size: 13.5px; font-weight: 700; color: var(--text-dark); line-height: 1.2; }
        .item-date { font-size: 10px; font-weight: 600; color: #94A3B8; }
        .item-category { font-size: 9px; font-weight: 700; background: #F1F5F9; color: #334155; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; border: 1px solid #E2E8F0; }

        .activity-stats-row {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
            background: #F8FAFC; padding: 8px; border-radius: 8px; border: 1px solid #F1F5F9;
        }

        .stat-group { display: flex; flex-direction: column; align-items: center; gap: 2px; }
        .stat-icon { color: #64748B; }
        .stat-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.2; }
        .stat-num { font-size: 11.5px; font-weight: 700; color: var(--text-dark); }
        
        .empty-state { text-align:center; padding:24px 16px; color:#64748B; font-size:13px; font-weight:600; background:#FFF; border-radius:12px; border:1px solid var(--border-light); box-shadow: var(--card-shadow); }
    </style>
</head>
<body>

    <!-- Sticky Header & Tab Bar -->
    <div class="sticky-top-container">
        <header class="track-header">
            <button class="back-btn" onclick="if(history.length > 1){ history.back(); } else { window.location.href='index.html'; }" aria-label="Go back">
                <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
            </button>
            <h1>Activity Hub</h1>
            <div class="header-spacer"></div>
        </header>

        <div class="view-toggle-container">
            <button class="toggle-btn active" data-target="notificationsView">
                <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                Notifications
            </button>
            <button class="toggle-btn" data-target="statsView">
                Dashboard
            </button>
        </div>
    </div>

    <!-- VIEW 1: NOTIFICATIONS -->
    <div id="notificationsView" class="view-section active">
        <main class="notifications-list" id="notificationsFeed">
            <div class="empty-state">Loading activity...</div>
        </main>
    </div>

    <!-- VIEW 2: DASHBOARD -->
    <div id="statsView" class="view-section">
        <!-- Global Overview -->
        <section class="dashboard-overview">
            <div class="overview-card">
                <div class="avatar-frame bg-blue">
                    <img src="all.jpg" alt="Views" onerror="this.remove();">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </div>
                <div class="overview-val" id="totalViews">0</div>
                <div class="overview-label">Total Views</div>
            </div>
            <div class="overview-card">
                <div class="avatar-frame bg-red">
                    <img src="li.jpg" alt="Likes" onerror="this.remove();">
                    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                </div>
                <div class="overview-val" id="totalLikes">0</div>
                <div class="overview-label">Total Likes</div>
            </div>
            <div class="overview-card">
                <div class="avatar-frame bg-yellow">
                    <img src="ree.jpg" alt="Rating" onerror="this.remove();">
                    <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                </div>
                <div class="overview-val" id="avgRating">0.0</div>
                <div class="overview-label">Avg Rating</div>
            </div>
            <div class="overview-card">
                <div class="avatar-frame bg-green">
                    <img src="co.jpg" alt="Comments" onerror="this.remove();">
                    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </div>
                <div class="overview-val" id="totalComments">0</div>
                <div class="overview-label">Comments</div>
            </div>
        </section>

        <div class="feed-header">
            <span>Listing Performance</span>
        </div>

        <main class="activity-feed-list" id="activityFeed">
            <div class="empty-state">Loading activity data...</div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyBXoIY6Q1Cf3Dw0jU5VImIqxchW79OME6Q", 
            authDomain: "delala-1b582.firebaseapp.com", 
            databaseURL: "https://delala-1b582-default-rtdb.firebaseio.com", 
            projectId: "delala-1b582", 
            storageBucket: "delala-1b582.firebasestorage.app", 
            messagingSenderId: "1073041850834", 
            appId: "1:1073041850834:web:fe5d0095c3ff1b238f480b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentActiveUserId = null;

        let postNotifications = [];
        let followerNotifications = [];
        let followingNotifications = [];

        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
                
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });

        function formatCount(num) {
            const val = parseInt(num) || 0;
            if (val >= 1000000) return (val / 1000000).toFixed(1) + 'M';
            if (val >= 1000) return (val / 1000).toFixed(1) + 'K';
            return val;
        }

        function timeAgo(timestamp) {
            if (!timestamp) return 'Recently';
            const seconds = Math.floor((new Date() - new Date(timestamp)) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "y ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "mo ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "d ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "h ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m ago";
            return "Just now";
        }

        function combineAndRenderNotifications() {
            const combined = [...postNotifications, ...followerNotifications, ...followingNotifications];
            renderNotifications(combined);
        }

        function listenActivityMetrics(userId) {
            const postsRef = ref(db, 'posts');
            const followersRef = ref(db, `followers/${userId}`);
            const followingRef = ref(db, `following/${userId}`);

            onValue(postsRef, (snapshot) => {
                const itemsList = [];
                postNotifications = [];
                let globalViews = 0, globalLikes = 0, globalComments = 0, totalRatingSum = 0, ratedPostsCount = 0;

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        const postOwnerId = String(item.userId || item.uid || item.postedByPhone || item.phone || '').replace(/\D/g, '').replace(/^0+/, '');
                        const cleanCurrentId = String(userId).replace(/\D/g, '').replace(/^0+/, '');

                        if (postOwnerId === cleanCurrentId || String(item.userId) === String(userId)) {
                            itemsList.push({ id: key, ...item });
                            
                            globalViews += (parseInt(item.views || item.viewCount) || 0);
                            globalLikes += (parseInt(item.likes || item.likesCount) || 0);
                            
                            const postTitle = item.title || 'Untitled Listing';

                            if (item.comments) {
                                Object.values(item.comments).forEach(c => {
                                    globalComments++;
                                    postNotifications.push({ type: 'comment', user: c.userName || 'Someone', text: c.text, time: c.timestamp, post: postTitle });
                                });
                            }
                            if (item.ratings) {
                                Object.values(item.ratings).forEach(r => {
                                    postNotifications.push({ type: 'rating', user: r.userName || 'Someone', val: r.rating || r.value, time: r.timestamp, post: postTitle });
                                });
                            }
                            if (item.averageRating && parseFloat(item.averageRating) > 0) {
                                totalRatingSum += parseFloat(item.averageRating);
                                ratedPostsCount++;
                            }
                            if (item.likedBy) {
                                Object.keys(item.likedBy).forEach(() => {
                                    postNotifications.push({ type: 'like', user: 'Someone', time: item.createdAt || Date.now(), post: postTitle });
                                });
                            }
                        }
                    });
                }

                document.getElementById('totalViews').innerText = formatCount(globalViews);
                document.getElementById('totalLikes').innerText = formatCount(globalLikes);
                document.getElementById('totalComments').innerText = formatCount(globalComments);
                document.getElementById('avgRating').innerText = ratedPostsCount > 0 ? (totalRatingSum / ratedPostsCount).toFixed(1) : '0.0';

                combineAndRenderNotifications();
                renderActivityFeed(itemsList);
            });

            onValue(followersRef, (snapshot) => {
                followerNotifications = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const val = child.val();
                        const time = (typeof val === 'object' && val !== null) ? val.timestamp : val;
                        followerNotifications.push({
                            type: 'follower',
                            user: child.key,
                            time: time || Date.now()
                        });
                    });
                }
                combineAndRenderNotifications();
            });

            onValue(followingRef, (snapshot) => {
                followingNotifications = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        const val = child.val();
                        const time = (typeof val === 'object' && val !== null) ? val.timestamp : val;
                        followingNotifications.push({
                            type: 'following',
                            user: child.key,
                            time: time || Date.now()
                        });
                    });
                }
                combineAndRenderNotifications();
            });
        }

        function renderNotifications(notifications) {
            const container = document.getElementById('notificationsFeed');
            container.innerHTML = '';

            if (notifications.length === 0) {
                container.innerHTML = `<div class="empty-state">No recent notifications.</div>`;
                return;
            }

            notifications.sort((a,b) => (b.time || 0) - (a.time || 0));

            notifications.forEach(notif => {
                const card = document.createElement('div');
                card.className = 'notification-card';

                if (notif.type === 'like') {
                    card.innerHTML = `
                        <div class="avatar-frame bg-red">
                            <img src="li.jpg" alt="Like" onerror="this.remove();">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        </div>
                        <div class="notif-content">
                            <strong>${notif.user}</strong> liked your post "<strong>${notif.post}</strong>".
                            <span class="notif-time">${timeAgo(notif.time)}</span>
                        </div>
                    `;
                } else if (notif.type === 'rating') {
                    card.innerHTML = `
                        <div class="avatar-frame bg-yellow">
                            <img src="ree.jpg" alt="Rating" onerror="this.remove();">
                            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        </div>
                        <div class="notif-content">
                            <strong>${notif.user}</strong> rated "<strong>${notif.post}</strong>" <strong>${notif.val} Stars</strong>.
                            <span class="notif-time">${timeAgo(notif.time)}</span>
                        </div>
                    `;
                } else if (notif.type === 'comment') {
                    card.innerHTML = `
                        <div class="avatar-frame bg-blue">
                            <img src="co.jpg" alt="Comment" onerror="this.remove();">
                            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        </div>
                        <div class="notif-content">
                            <strong>${notif.user}</strong> commented on "<strong>${notif.post}</strong>".
                            <div class="notif-quote">"${notif.text}"</div>
                            <span class="notif-time">${timeAgo(notif.time)}</span>
                        </div>
                    `;
                } else if (notif.type === 'follower') {
                    card.innerHTML = `
                        <div class="avatar-frame bg-purple">
                            <img src="fe.jpg" alt="Follower" onerror="this.remove();">
                            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle></svg>
                        </div>
                        <div class="notif-content">
                            <strong>${notif.user}</strong> started following you.
                            <span class="notif-time">${timeAgo(notif.time)}</span>
                        </div>
                    `;
                } else if (notif.type === 'following') {
                    card.innerHTML = `
                        <div class="avatar-frame bg-green">
                            <img src="fo.jpg" alt="Following" onerror="this.remove();">
                            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle></svg>
                        </div>
                        <div class="notif-content">
                            You started following <strong>${notif.user}</strong>.
                            <span class="notif-time">${timeAgo(notif.time)}</span>
                        </div>
                    `;
                }
                container.appendChild(card);
            });
        }

        function renderActivityFeed(items) {
            const container = document.getElementById('activityFeed');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<div class="empty-state">Post an item to see metrics!</div>`;
                return;
            }

            items.sort((a,b) => (b.timestamp || b.createdAt || 0) - (a.timestamp || a.createdAt || 0));

            items.forEach(item => {
                const commentCount = item.comments ? Object.keys(item.comments).length : 0;
                
                const card = document.createElement('div');
                card.className = 'activity-card';
                card.innerHTML = `
                    <div class="activity-card-header">
                        <div class="item-title-wrapper">
                            <span class="item-title">${item.title || 'Untitled Listing'}</span>
                            <span class="item-date">Posted ${timeAgo(item.timestamp || item.createdAt)}</span>
                        </div>
                        <span class="item-category">${item.category || item.rentalType || 'Listing'}</span>
                    </div>
                    
                    <div class="activity-stats-row">
                        <div class="stat-group">
                            <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
                            <span class="stat-num">${formatCount(item.views || item.viewCount || 0)}</span>
                        </div>
                        <div class="stat-group">
                            <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg></div>
                            <span class="stat-num">${formatCount(item.likes || item.likesCount || 0)}</span>
                        </div>
                        <div class="stat-group">
                            <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg></div>
                            <span class="stat-num">${formatCount(commentCount)}</span>
                        </div>
                        <div class="stat-group">
                            <div class="stat-icon"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
                            <span class="stat-num">${item.averageRating ? parseFloat(item.averageRating).toFixed(1) : '0.0'}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        onAuthStateChanged(auth, (user) => {
            const sessionPhone = localStorage.getItem('auth_session_phone');
            if (user) {
                currentActiveUserId = user.uid;
                listenActivityMetrics(currentActiveUserId);
            } else if (sessionPhone) {
                currentActiveUserId = sessionPhone.replace(/^0+/, '');
                listenActivityMetrics(currentActiveUserId);
            } else {
                document.getElementById('notificationsFeed').innerHTML = `<div class="empty-state">Please log in to view your activity tracking.</div>`;
                document.getElementById('activityFeed').innerHTML = `<div class="empty-state">Please log in to view your activity tracking.</div>`;
            }
        });
    </script>
</body>
</html>
