<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Delala - Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --primary-dark: #0F172A;
            --bg-body: #F4F7F9;
            --card-bg: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --success-color: #34D399;
            --offline-color: #94A3B8;

            --silver-grad: linear-gradient(145deg, #64748B, #334155, #0F172A);
            --silver-shadow: inset 0px 2px 2px rgba(255, 255, 255, 0.25), inset 0px -2px 4px rgba(0, 0, 0, 0.5), 0 4px 10px rgba(15, 23, 42, 0.25);
        }

        * { font-family: var(--font-main); box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow: hidden;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-body);
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        /* Chat Header */
        .chat-header {
            background: linear-gradient(145deg, #1E293B, #0F172A);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(15,23,42,0.25);
            border-bottom: 1px solid #334155;
        }

        .btn-icon-3d {
            background: var(--silver-grad);
            border: 1px solid #475569;
            width: 38px; height: 38px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: #FFFFFF; cursor: pointer; flex-shrink: 0;
            box-shadow: var(--silver-shadow);
        }
        .btn-icon-3d svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2.5; fill: none; stroke-linecap: round; }

        .chat-header-info { flex: 1; min-width: 0; }
        .chat-header-info h2 { font-size: 15px; font-weight: 800; color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-info p { font-size: 11px; font-weight: 600; color: #94A3B8; margin-top: 1px; }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #F8FAFC;
        }

        .message-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .message-bubble.incoming {
            background: #FFFFFF;
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }

        .message-bubble.outgoing {
            background: linear-gradient(145deg, #1E293B, #0F172A);
            color: #FFFFFF;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 9px;
            margin-top: 4px;
            text-align: right;
            opacity: 0.7;
            font-weight: 600;
        }

        /* Chat Input Area */
        .chat-input-area {
            background: #FFFFFF;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-top: 1px solid var(--border-color);
        }

        .chat-input {
            flex: 1;
            height: 44px;
            background: #F1F5F9;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 0 14px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            outline: none;
        }
        .chat-input:focus { border-color: #64748B; background: #FFFFFF; }

        .send-btn {
            background: var(--silver-grad);
            border: none;
            width: 44px; height: 44px;
            border-radius: 14px;
            color: #FFFFFF;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: var(--silver-shadow);
            flex-shrink: 0;
        }
        .send-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
    </style>
</head>
<body>

    <div class="screen">
        <header class="chat-header">
            <button class="btn-icon-3d" id="btnBack">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="chat-header-info">
                <h2 id="chatTitle">Loading...</h2>
                <p id="chatStatus">Connecting...</p>
            </div>
        </header>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input type="text" id="messageInput" class="chat-input" placeholder="Type a message...">
            <button class="send-btn" id="btnSend">
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBXoIY6Q1Cf3Dw0jU5VImIqxchW79OME6Q",
            authDomain: "delala-1b582.firebaseapp.com",
            databaseURL: "https://delala-1b582-default-rtdb.firebaseio.com",
            projectId: "delala-1b582",
            storageBucket: "delala-1b582.firebasestorage.app",
            messagingSenderId: "1073041850834",
            appId: "1:1073041850834:web:fe5d0095c3ff1b238f480b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const otherUserId = urlParams.get('userId');
        const otherUserName = urlParams.get('userName') || otherUserId;
        const myUsername = localStorage.getItem('myAppUsername');

        document.getElementById('chatTitle').textContent = otherUserName;
        document.getElementById('btnBack').onclick = () => { window.location.href = 'index.html'; };

        // Generate consistent Chat ID between two users (alphabetically sorted)
        const chatId = [myUsername, otherUserId].sort().join('_');

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const btnSend = document.getElementById('btnSend');
        const chatStatus = document.getElementById('chatStatus');

        // Track user presence and typing status
        db.ref(`users/${otherUserId}/presence`).on('value', (snap) => {
            const presence = snap.val();
            if(!presence) {
                chatStatus.textContent = 'Offline';
                return;
            }
            if(presence.isOnline) {
                chatStatus.textContent = 'Online';
            } else {
                const lastSeenDate = new Date(presence.lastSeen).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                chatStatus.textContent = `Last seen ${lastSeenDate}`;
            }
        });

        // Load Messages
        db.ref(`chat_messages/${chatId}`).on('value', (snapshot) => {
            chatMessages.innerHTML = '';
            const messages = snapshot.val();
            if(!messages) return;

            Object.keys(messages).forEach(msgKey => {
                const msg = messages[msgKey];
                const isOutgoing = msg.sender === myUsername;

                const div = document.createElement('div');
                div.className = `message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;
                div.innerHTML = `
                    <div>${escapeHtml(msg.text)}</div>
                    <div class="message-time">${formatTime(msg.timestamp)}</div>
                `;
                chatMessages.appendChild(div);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        });

        // Send Message Handler
        function sendMessage() {
            const text = messageInput.value.trim();
            if(!text) return;

            const timestamp = Date.now();
            const msgRef = db.ref(`chat_messages/${chatId}`).push();

            // 1. Push to chat messages log
            msgRef.set({
                sender: myUsername,
                text: text,
                timestamp: timestamp,
                isRead: false
            });

            // 2. Update Inbox previews for BOTH users instantly
            const chatPreviewData = {
                chatId: chatId,
                lastMessage: text,
                timestamp: timestamp
            };

            db.ref(`user_chats/${myUsername}/${otherUserId}`).set(chatPreviewData);
            db.ref(`user_chats/${otherUserId}/${myUsername}`).set(chatPreviewData);

            messageInput.value = '';
        }

        btnSend.onclick = sendMessage;
        messageInput.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') sendMessage();
        });

        function formatTime(ts) {
            if(!ts) return '';
            return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
