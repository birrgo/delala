<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BirrGo - 3D Globe Location</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- MapLibre GL -->
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    
    <style>
        :root {
            --bg-main: #FFFFFF;
            --bg-secondary: #F8FAFC;
            --silver-light: #E2E8F0;
            --silver-metallic: #94A3B8;
            --silver-dark: #475569;
            --text-dark: #1E293B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-secondary);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header with Search Box & Navigation Actions */
        .nav-header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--silver-light);
            box-shadow: 0 4px 20px rgba(71, 85, 105, 0.08);
            flex-wrap: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-all {
            background: var(--silver-dark);
            color: var(--bg-main);
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(71, 85, 105, 0.2);
        }

        .btn-all:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        .search-input-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
        }

        .header-search-input {
            width: 100%;
            padding: 10px 38px 10px 16px;
            border-radius: 24px;
            border: 2px solid var(--silver-light);
            background: var(--bg-main);
            color: var(--text-dark);
            font-size: 13px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(71, 85, 105, 0.05);
        }

        .header-search-input:focus {
            border-color: var(--silver-dark);
            box-shadow: 0 0 0 3px rgba(71, 85, 105, 0.1);
        }

        .header-search-input::placeholder {
            color: var(--silver-metallic);
            font-weight: 500;
        }

        .search-icon {
            position: absolute;
            right: 14px;
            color: var(--silver-dark);
            pointer-events: none;
        }

        /* Search Results Preview Dropdown */
        .results-preview-container {
            position: absolute;
            top: 65px;
            left: 16px;
            right: 16px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid var(--silver-light);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(71, 85, 105, 0.15);
            max-height: 320px;
            overflow-y: auto;
            z-index: 90;
            display: none;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
        }

        .results-preview-container.active {
            display: flex;
        }

        .status-message {
            text-align: center;
            padding: 16px;
            color: var(--silver-metallic);
            font-size: 13px;
            font-weight: 600;
        }

        .location-card {
            background: var(--bg-main);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .location-card:hover, .location-card:active {
            background: var(--bg-secondary);
            border-color: var(--silver-light);
        }

        .location-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-secondary);
            color: var(--silver-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid var(--silver-light);
        }

        .location-details {
            overflow: hidden;
            flex: 1;
        }

        .location-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .location-subtitle {
            font-size: 11px;
            color: var(--silver-metallic);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 3D Globe Section (Shifted a little bit up) */
        .globe-section {
            margin-top: 75px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            flex: 1;
        }

        .globe-wrapper {
            width: 290px;
            height: 290px;
            border-radius: 50%;
            position: relative;
            background: var(--silver-light);
            border: 4px solid var(--silver-light);
            box-shadow: 
                0 18px 40px rgba(71, 85, 105, 0.22),
                0 6px 16px rgba(71, 85, 105, 0.12);
            overflow: hidden;
        }

        .globe-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            box-shadow: 
                inset -20px -20px 40px rgba(30, 41, 59, 0.3), 
                inset 10px 10px 20px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 10;
        }

        #globeMap {
            width: 100%;
            height: 100%;
        }

        .map-crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background: var(--silver-dark);
            border-radius: 50%;
            border: 3px solid var(--bg-main);
            z-index: 15;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .selected-location-display {
            margin-top: 24px;
            text-align: center;
        }

        .selected-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .confirm-btn {
            margin-top: 14px;
            padding: 12px 28px;
            background: var(--silver-dark);
            color: var(--bg-main);
            border: none;
            border-radius: 24px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(71, 85, 105, 0.3);
            display: none;
        }
        
        .confirm-btn.visible {
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Header with Embedded Search & All Locations Reset Button -->
    <header class="nav-header">
        <div class="header-actions">
            <!-- Reset Filters & Show All Locations Button -->
            <button class="btn-all" onclick="resetAndClearFilters()" title="Show all locations">All</button>
        </div>

        <form id="searchForm" class="search-input-wrapper" onsubmit="event.preventDefault(); triggerSearch();">
            <input type="text" id="citySearch" class="header-search-input" placeholder="Search city or country..." autocomplete="off">
            <div class="search-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
        </form>

        <!-- Search Preview List Box -->
        <div class="results-preview-container" id="resultsContainer">
            <div class="status-message">Start typing above...</div>
        </div>
    </header>

    <!-- Centered 3D Globe Section -->
    <section class="globe-section">
        <div class="globe-wrapper">
            <div id="globeMap"></div>
            <div class="map-crosshair"></div>
        </div>
        
        <div class="selected-location-display">
            <div class="selected-title" id="selectedTitle">World Globe View</div>
            <button class="confirm-btn" id="confirmBtn" onclick="submitFinalLocation()">Confirm Location</button>
        </div>
    </section>

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

    <script>
        const searchInput = document.getElementById('citySearch');
        const resultsContainer = document.getElementById('resultsContainer');
        const selectedTitle = document.getElementById('selectedTitle');
        const confirmBtn = document.getElementById('confirmBtn');
        
        let debounceTimer = null;
        let map = null;
        let activeLocation = null;

        // Force-clears ALL storage and redirects cleanly without caching
        function resetAndClearFilters() {
            // Remove specific keys across both session and local storage
            const keys = [
                'rental_location', 
                'selected_city', 
                'selected_country', 
                'location_filter', 
                'rental_scroll_pos',
                'active_city',
                'filter_location'
            ];

            keys.forEach(k => {
                sessionStorage.removeItem(k);
                localStorage.removeItem(k);
            });

            // Wipe full sessionStorage
            sessionStorage.clear();

            // Redirect with reset flag and timestamp to bust browser cache
            window.location.href = 'rental.html?reset=true&t=' + Date.now();
        }

        function initGlobe() {
            map = new maplibregl.Map({
                container: 'globeMap',
                style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
                center: [38.7881, 9.0034],
                zoom: 2,
                pitch: 55,
                bearing: 0,
                attributionControl: false
            });

            map.on('load', () => {
                rotateCamera(0);
            });
        }

        function rotateCamera(timestamp) {
            if (!activeLocation) {
                map.rotateTo((timestamp / 200) % 360, { duration: 0 });
                requestAnimationFrame(rotateCamera);
            }
        }

        async function queryOSMMapLocations(query) {
            if (!query || query.trim().length < 2) {
                resultsContainer.classList.remove('active');
                return;
            }

            resultsContainer.classList.add('active');
            resultsContainer.innerHTML = '<div class="status-message">Searching global locations...</div>';

            try {
                const endpoint = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&addressdetails=1&limit=6`;
                const response = await fetch(endpoint, { headers: { 'Accept-Language': 'en' } });
                
                if (!response.ok) throw new Error('Network error');
                
                const locations = await response.json();
                renderMapSuggestions(locations, query);
            } catch (error) {
                resultsContainer.innerHTML = `<div class="status-message" style="color:var(--silver-dark);">Failed to connect. Try again.</div>`;
            }
        }

        function renderMapSuggestions(locations, originalQuery) {
            resultsContainer.innerHTML = '';

            if (!locations || locations.length === 0) {
                resultsContainer.innerHTML = `<div class="status-message">No locations found for "${originalQuery}".</div>`;
                return;
            }

            const fragment = document.createDocumentFragment();
            locations.forEach(place => {
                const cityName = place.address.city || place.address.town || place.address.state || place.address.country || place.display_name.split(',')[0];
                const lat = parseFloat(place.lat);
                const lon = parseFloat(place.lon);

                const card = document.createElement('div');
                card.className = "location-card";
                card.onclick = () => focusGlobeOnLocation(cityName, lat, lon);

                card.innerHTML = `
                    <div class="location-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </div>
                    <div class="location-details">
                        <div class="location-title">${cityName}</div>
                        <div class="location-subtitle">${place.display_name}</div>
                    </div>
                `;
                fragment.appendChild(card);
            });

            resultsContainer.appendChild(fragment);
        }

        function focusGlobeOnLocation(name, lat, lng) {
            activeLocation = { name, lat, lng };
            
            selectedTitle.textContent = name;
            confirmBtn.classList.add('visible');
            resultsContainer.classList.remove('active');

            map.flyTo({
                center: [lng, lat],
                zoom: 13,
                pitch: 60,
                bearing: 45,
                speed: 1.5,
                curve: 1.2
            });
        }

        function submitFinalLocation() {
            if (activeLocation) {
                sessionStorage.setItem('rental_location', activeLocation.name);
                let targetUrl = `rental.html?location=${encodeURIComponent(activeLocation.name)}&lat=${activeLocation.lat}&lng=${activeLocation.lng}`;
                window.location.href = targetUrl;
            }
        }

        function triggerSearch() {
            queryOSMMapLocations(searchInput.value.trim());
            searchInput.blur();
        }

        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                queryOSMMapLocations(e.target.value.trim());
            }, 350);
        });

        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !resultsContainer.contains(e.target)) {
                resultsContainer.classList.remove('active');
            }
        });

        initGlobe();
    </script>
</body>
</html>
