<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Deletion Request - Hulum Gebeya</title>
    
    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #081B38;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { color: #081B38; margin-top: 0; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #081B38;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover { background-color: #0F2C59; }
        #successMessage {
            display: none;
            color: green;
            background: #e6ffe6;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Hulum Gebeya</h1>
    </div>

    <div class="container">
        <h2>Request Data Deletion</h2>
        <p>If you have uninstalled the app and wish to permanently delete your account, posts, and chats, please enter your registered Phone Number or User ID below.</p>
        
        <form id="deletionForm">
            <label for="userPhone">Registered Phone Number / User ID:</label>
            <input type="text" id="userPhone" placeholder="Enter phone number..." required>
            
            <button type="submit">Submit Deletion Request</button>
        </form>

        <div id="successMessage">
            ✅ Your request has been received! Your data will be permanently deleted within 7 days.
        </div>
    </div>

    <script>
        // Your exact Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBXoIY6Q1Cf3Dw0jU5VImIqxchW79OME6Q",
            authDomain: "delala-1b582.firebaseapp.com",
            databaseURL: "https://delala-1b582-default-rtdb.firebaseio.com",
            projectId: "delala-1b582",
            storageBucket: "delala-1b582.firebasestorage.app",
            messagingSenderId: "1073041850834",
            appId: "1:1073041850834:web:fe5d0095c3ff1b238f480b",
            measurementId: "G-2XW8F8FKBT"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Handle Form Submit
        document.getElementById('deletionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userIdentifier = document.getElementById('userPhone').value;
            
            // Push request to Firebase Realtime Database
            database.ref('deletion_requests').push({
                userPhone: userIdentifier,
                timestamp: Date.now(),
                status: 'pending_deletion'
            }).then(() => {
                // Show success message and hide form
                document.getElementById('deletionForm').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';
            }).catch((error) => {
                alert("Error submitting request. Please try again.");
                console.error(error);
            });
        });
    </script>

</body>
</html>
