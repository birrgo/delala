    <style>
        .author-actions-right { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
        
        /* --- IMAGE BLUR LOADING EFFECT --- */
        .broadcast-image-frame {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #e2e8f0; 
            margin-bottom: 12px;
            position: relative;
        }
        .broadcast-image-frame img {
            width: 100%;
            height: auto;
            max-height: 350px;
            object-fit: cover;
            display: block;
            filter: blur(20px); 
            transform: scale(1.1); 
            transition: filter 0.6s ease-out, transform 0.6s ease-out;
            will-change: filter, transform;
        }
        .broadcast-image-frame img.loaded {
            filter: blur(0);
            transform: scale(1);
        }
        /* --------------------------------- */

        .animated-distance-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; color: #0284c7; background: rgba(2, 132, 199, 0.08); border: 1px solid rgba(2, 132, 199, 0.25); white-space: nowrap; cursor: pointer; transition: all 0.3s ease; animation: distancePulse 2.5s infinite ease-in-out; }
        .animated-distance-chip.no-gps { color: #64748b; background: #f1f5f9; border-color: #e2e8f0; animation: none; }
        .animated-distance-chip .gps-dot { width: 6px; height: 6px; background-color: #0284c7; border-radius: 50%; display: inline-block; animation: dotGlow 1.5s infinite; }
        .animated-distance-chip.no-gps .gps-dot { background-color: #94a3b8; animation: none; }
        @keyframes distancePulse { 0% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.25); } 50% { box-shadow: 0 0 0 5px rgba(2, 132, 199, 0); } 100% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); } }
        @keyframes dotGlow { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.3); } }
        .btn-follow-author.following { background-color: #e2e8f0 !important; color: #334155 !important; border-color: #cbd5e1 !important; }
        .social-action-btn.liked svg { fill: #ef4444; stroke: #ef4444; animation: likeHeart 0.3s ease-in-out; }
        @keyframes likeHeart { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .active-filter-indicator { background: rgba(56, 189, 248, 0.2) !important; color: #0284c7 !important; border: 1px solid rgba(2, 132, 199, 0.3); }

        /* Comment User Previews */
        .comment-user-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
        .comment-user-initial { width: 22px; height: 22px; border-radius: 50%; background-color: #e2e8f0; color: #334155; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; }
        .comment-preview-wrapper { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
        .comment-text-content { font-size: 13px; line-height: 1.4; color: #334155; }
    </style>
</head>
<body>

    <div class="app-view">

        <!-- Status Modal Overlay -->

        <!-- Bottom Navigation Bar -->

                <div class="icon-bg">
                    <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>

                <div class="post-fab-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>

                    <img id="navProfilePic" class="nav-profile-img" src="" alt="Profile" style="display:none;">

        </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, query, orderByChild, limitToLast, endBefore, get, set, remove, runTransaction, startAt, endAt } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXoIY6Q1Cf3Dw0jU5VImIqxchW79OME6Q",
            authDomain: "delala-1b582.firebaseapp.com",
            databaseURL: "https://delala-1b582-default-rtdb.firebaseio.com",
            projectId: "delala-1b582",
            storageBucket: "delala-1b582.firebasestorage.app",
            messagingSenderId: "1073041850834",
            appId: "1:1073041850834:web:fe5d0095c3ff1b238f480b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const BATCH_LIMIT = 8; 
        let lastLoadedTimestamp = null;
        let lastLoadedKey = null;
        let isLoading = false;
        let hasMoreItems = true;
        
        let localCachedBroadcasts = [];
        let currentUserCoordinates = null;
        let isGpsActive = false;
        let activeCategoryFilter = 'all';
        
        // Comprehensive User Credentials Tracking
        let currentActiveUserId = null;
        let currentUserPhoto = '';
        let currentUserDisplayName = '';
        let userFollowingSet = new Set();

        const DOM = {
            container: document.getElementById('broadcastsContainer'),
            triggerEl: document.getElementById('infiniteScrollTrigger'),
            popupModal: document.getElementById('customPopupModule'),
            popupTitleNode: document.getElementById('popupTitleNode'),
            popupDescNode: document.getElementById('popupDescNode'),
            popupIconNode: document.getElementById('popupIconNode'),
            closePopupBtn: document.getElementById('closePopupBtn'),
            gpsBtn: document.getElementById('triggerGpsFilterBtn'),
            catLinkBtn: document.getElementById('categoryMenuLink'),
            headerTitle: document.getElementById('dynamicHeaderTitle')
        };

        const BITS = [16, 8, 4, 2, 1];
        const BASE32 = "0123456789bcdefghjkmnpqrstuvwxyz";

        function encodeFastGeohash(latitude, longitude, precision = 7) {
            let isEven = true, lat = [-90.0, 90.0], lon = [-180.0, 180.0], bit = 0, ch = 0, geohash = "";
            while (geohash.length < precision) {
                let mid = isEven ? (lon[0] + lon[1]) / 2 : (lat[0] + lat[1]) / 2;
                if (isEven) { if (longitude > mid) { ch |= BITS[bit]; lon[0] = mid; } else lon[1] = mid; }
                else { if (latitude > mid) { ch |= BITS[bit]; lat[0] = mid; } else lat[1] = mid; }
                isEven = !isEven;
                if (bit < 4) bit++; else { geohash += BASE32[ch]; bit = 0; ch = 0; }
            }
            return geohash;
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371; const dLat = deg2rad(lat2 - lat1); const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }
        function deg2rad(deg) { return deg * (Math.PI / 180); }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const requestedCategory = urlParams.get('category');
            if (requestedCategory && requestedCategory !== 'all') {
                activeCategoryFilter = requestedCategory.toLowerCase();
                DOM.catLinkBtn.classList.add('active-filter-indicator');
                const formattedName = activeCategoryFilter.charAt(0).toUpperCase() + activeCategoryFilter.slice(1);
                DOM.headerTitle.innerHTML = `Rentals <span style="font-size:12px; color:#38bdf8;">• ${formattedName}</span>`;
            }

            if (DOM.closePopupBtn) {
                DOM.closePopupBtn.addEventListener('click', () => DOM.popupModal.classList.remove('show-popup'));
            }

            setupInfiniteScrollObserver();
            setupGpsDetectionControl();
            setupAuthListener();
            
            fetchItemsBatch();
        });

        // Robust Session Synchronization matching Profile Page
        function setupAuthListener() {
            onAuthStateChanged(auth, (user) => {
                const sessionPhone = localStorage.getItem('auth_session_phone');
                if (user) {
                    localStorage.removeItem('user_logged_out');
                    fetchUserData(user.uid, user);
                } else if (sessionPhone) {
                    localStorage.removeItem('user_logged_out');
                    fetchUserByPhone(sessionPhone);
                } else {
                    renderGuestState();
                }
            });

            window.addEventListener('storage', (e) => {
                if (e.key === 'auth_session_phone' || e.key === 'user_logged_out') {
                    setupAuthListener();
                }
            });
        }

        async function fetchUserByPhone(phone) {
            const cleanPhone = phone.replace(/^0+/, '');
            try {
                const snapshot = await get(ref(db, `users/${cleanPhone}`));
                if (snapshot.exists()) {
                    applyUserDataToDOM(snapshot.val(), cleanPhone);
                    return;
                }
                const querySnap = await get(ref(db, 'users'));
                if (querySnap.exists()) {
                    const data = querySnap.val();
                    const matchedKey = Object.keys(data).find(k => {
                        const u = data[k];
                        const uPhone = String(u.cleanPhone || u.phone || u.phoneNumber || '').replace(/\D/g, '').replace(/^0+/, '');
                        return uPhone === cleanPhone || k === cleanPhone;
                    });
                    if (matchedKey) {
                        applyUserDataToDOM(data[matchedKey], matchedKey);
                        return;
                    }
                }
                renderGuestState();
            } catch (err) {
                renderGuestState();
            }
        }

        async function fetchUserData(userId, authUser) {
            currentActiveUserId = userId;
            try {
                const snapshot = await get(ref(db, `users/${userId}`));
                if (snapshot.exists()) {
                    applyUserDataToDOM(snapshot.val(), userId);
                } else {
                    const parts = authUser.displayName ? authUser.displayName.split(' ') : [];
                    const firstName = parts[0] || "User";
                    const fallbackData = { displayName: authUser.displayName || firstName, firstName: firstName, photoURL: authUser.photoURL || '' };
                    applyUserDataToDOM(fallbackData, userId);
                }
            } catch (e) {
                renderGuestState();
            }
        }

        function applyUserDataToDOM(userData, userId) {
            currentActiveUserId = userId;
            let firstName = userData.firstName || userData.first_name || "";
            let middleName = userData.middleName || userData.middle_name || userData.fatherName || "";
            if (!firstName && userData.fullName) { 
                const parts = userData.fullName.trim().split(/\s+/); 
                firstName = parts[0] || ""; 
                middleName = parts[1] || ""; 
            }

            currentUserDisplayName = userData.displayName || `${firstName} ${middleName}`.trim() || userData.username || "User";
            currentUserPhoto = userData.profilePicture || userData.photoURL || '';

            if (userData.following_list && typeof userData.following_list === 'object') {
                userFollowingSet = new Set(Object.keys(userData.following_list));
            } else if (userData.following && typeof userData.following === 'object') {
                userFollowingSet = new Set(Object.keys(userData.following));
            }

            const shortFirstName = currentUserDisplayName.trim().split(' ')[0] || 'User';
            const imgEl = document.getElementById('navProfilePic');
            const iconEl = document.getElementById('navProfileIcon');
            const nameEl = document.getElementById('navProfileName');
            const footerShieldEl = document.getElementById('footerShieldText');

            if (currentUserPhoto && imgEl) { 
                imgEl.src = currentUserPhoto; 
                imgEl.style.display = 'block'; 
                if (iconEl) iconEl.style.display = 'none'; 
            }
            if (nameEl) nameEl.innerText = shortFirstName;
            if (footerShieldEl) footerShieldEl.innerText = `${shortFirstName} Verified`;

            if (localCachedBroadcasts.length > 0) {
                DOM.container.innerHTML = '';
                renderFilteredListings(localCachedBroadcasts);
            }
        }

        function renderGuestState() {
            currentActiveUserId = null;
            currentUserPhoto = '';
            currentUserDisplayName = '';
            userFollowingSet.clear();
            
            const imgEl = document.getElementById('navProfilePic');
            const iconEl = document.getElementById('navProfileIcon');
            const nameEl = document.getElementById('navProfileName');
            const footerShieldEl = document.getElementById('footerShieldText');

            if (imgEl) imgEl.style.display = 'none';
            if (iconEl) iconEl.style.display = 'block';
            if (nameEl) nameEl.innerText = 'Profile';
            if (footerShieldEl) footerShieldEl.innerText = 'Guest Verified';
        }

        // Global check utility to verify if user is fully logged in before actions
        function getActiveLoggedInUserId() {
            if (currentActiveUserId) return currentActiveUserId;
            if (auth.currentUser) return auth.currentUser.uid;
            const sessionPhone = localStorage.getItem('auth_session_phone');
            if (sessionPhone) return sessionPhone.replace(/\D/g, '').replace(/^0+/, '');
            return null;
        }

        function isRentalCategory(item) {
            if (!item) return false;
            const rType = String(item.rentalType || '').trim().toLowerCase();
            const cat = String(item.category || '').trim().toLowerCase();
            return rType.length > 0 || cat.includes('rental') || cat.includes('rent');
        }

        function itemMatchesCategory(item) {
            if (activeCategoryFilter === 'all') return true;
            const searchStr = [item.rentalSubCategory, item.subCategory, item.category, item.rentalType, item.title].join(' ').toLowerCase();
            return searchStr.includes(activeCategoryFilter);
        }

        async function fetchItemsBatch() {
            if (isLoading || !hasMoreItems) return;
            isLoading = true;
            if (DOM.triggerEl) DOM.triggerEl.innerText = `⏳ Loading Database Items...`;

            const nodePaths = ['posts', 'delala_new'];

            try {
                const fetchPromises = nodePaths.map(async (nodePath) => {
                    const baseRef = ref(db, nodePath);
                    let dbQuery = lastLoadedTimestamp !== null 
                        ? query(baseRef, orderByChild('createdAt'), endBefore(lastLoadedTimestamp, lastLoadedKey), limitToLast(BATCH_LIMIT))
                        : query(baseRef, orderByChild('createdAt'), limitToLast(BATCH_LIMIT));

                    const snapshot = await get(dbQuery);
                    const results = [];
                    if (snapshot.exists()) {
                        snapshot.forEach((childSnap) => {
                            results.push({ id: childSnap.key, _dbPath: nodePath, ...childSnap.val() });
                        });
                    }
                    return results;
                });

                const rawResults = await Promise.all(fetchPromises);
                const fetchedListings = rawResults.flat();

                if (fetchedListings.length === 0) {
                    hasMoreItems = false;
                    if (DOM.triggerEl) DOM.triggerEl.innerText = localCachedBroadcasts.length === 0 ? "" : "All items loaded.";
                    if (localCachedBroadcasts.length === 0) renderEmptyState();
                    return;
                }

                fetchedListings.sort((a, b) => (b.createdAt || b.timestamp || 0) - (a.createdAt || a.timestamp || 0));

                const validItems = [];
                for (const rawItem of fetchedListings) {
                    const currentTS = rawItem.createdAt || rawItem.timestamp || 0;
                    if (lastLoadedTimestamp === null || currentTS < lastLoadedTimestamp) {
                        lastLoadedTimestamp = currentTS;
                        lastLoadedKey = rawItem.id;
                    }

                    if (isRentalCategory(rawItem) && itemMatchesCategory(rawItem) && !localCachedBroadcasts.some(b => b.id === rawItem.id)) {
                        validItems.push(rawItem);
                    }
                }

                if (validItems.length > 0) {
                    localCachedBroadcasts.push(...validItems);
                    renderFilteredListings(validItems);
                } 
                
                if (validItems.length === 0 && hasMoreItems) {
                    isLoading = false;
                    return fetchItemsBatch();
                }

                if (DOM.triggerEl) {
                    DOM.triggerEl.innerText = hasMoreItems ? "⏳ Scroll for more..." : "All items loaded.";
                }

            } catch (error) {
                console.error("Error loading posts:", error);
            } finally {
                isLoading = false;
            }
        }

        function renderFilteredListings(itemsToAppend) {
            if (!DOM.container) return;

            const fragment = document.createDocumentFragment();
            itemsToAppend.forEach(item => {
                const card = document.createElement('article');
                card.className = "featured-broadcast-card";
                card.id = `item-card-${item.id}`;
                card.setAttribute('onclick', `openFullNewsReader('${item.id}', '${item._dbPath || 'posts'}')`);
                card.innerHTML = buildSingleNewsCardHTML(item);
                fragment.appendChild(card);
            });
            DOM.container.appendChild(fragment);
            restoreScrollPosition();
        }

        function renderEmptyState() {
            if (!DOM.container) return;
            DOM.container.innerHTML = `
                <article class="featured-broadcast-card">
                    <div class="badge-meta-row"><span class="spotlight-pill">Rental Market</span></div>
                    <h2 class="broadcast-title" style="margin-top:8px;">No Items Found</h2>
                    <p class="broadcast-body-text" style="color: #64748B; font-size:13px; margin-top:4px;">No active rental listings available for this category right now.</p>
                </article>
            `;
        }

        function setupInfiniteScrollObserver() {
            if (!DOM.triggerEl) return;
            const observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && !isLoading && hasMoreItems && !isGpsActive) {
                    fetchItemsBatch();
                }
            }, { rootMargin: '200px', threshold: 0.1 });
            observer.observe(DOM.triggerEl);
        }

        function extractItemCoordinates(item) {
            if (item.location && typeof item.location === 'object') {
                const lat = parseFloat(item.location.latitude); const lng = parseFloat(item.location.longitude);
                if (!isNaN(lat) && !isNaN(lng)) return { lat, lng };
            }
            const fallbackLat = item.latitude ?? item.lat ?? item.locationDetails?.lat ?? item.coordinates?.lat;
            const fallbackLng = item.longitude ?? item.lng ?? item.locationDetails?.lng ?? item.coordinates?.lng;
            if (fallbackLat !== undefined && fallbackLng !== undefined) {
                const pLat = parseFloat(fallbackLat); const pLng = parseFloat(fallbackLng);
                if (!isNaN(pLat) && !isNaN(pLng)) return { lat: pLat, lng: pLng };
            }
            return null;
        }

        async function fetchNearbyItemsFromDB() {
            if (!currentUserCoordinates) return;
            isLoading = true;
            const userGeohash = encodeFastGeohash(currentUserCoordinates.lat, currentUserCoordinates.lng, 3); 
            const nodePaths = ['posts', 'delala_new'];
            const matchingItems = [];
            const seenIds = new Set(); 

            try {
                for (const nodePath of nodePaths) {
                    const q = query(ref(db, nodePath), orderByChild('geohash'), startAt(userGeohash), endAt(userGeohash + '\uf8ff'));
                    const snapshot = await get(q);
                    
                    snapshot.forEach((childSnap) => {
                        const rawItem = { id: childSnap.key, _dbPath: nodePath, ...childSnap.val() };
                        if (!seenIds.has(rawItem.id) && isRentalCategory(rawItem) && itemMatchesCategory(rawItem)) {
                            const coords = extractItemCoordinates(rawItem);
                            if (coords) {
                                const dist = calculateDistanceKm(currentUserCoordinates.lat, currentUserCoordinates.lng, coords.lat, coords.lng);
                                if (dist <= 50) { rawItem._calculatedDistance = dist; matchingItems.push(rawItem); seenIds.add(rawItem.id); }
                            }
                        }
                    });
                }
                
                DOM.container.innerHTML = '';
                matchingItems.sort((a, b) => a._calculatedDistance - b._calculatedDistance);
                localCachedBroadcasts = matchingItems; 
                if(matchingItems.length > 0) renderFilteredListings(matchingItems);
                else renderEmptyState();

                if (DOM.triggerEl) DOM.triggerEl.innerText = matchingItems.length > 0 ? "All nearby items loaded." : "No items found nearby.";
            } catch (error) { console.error("Error fetching nearby posts:", error); } 
            finally { isLoading = false; }
        }

        window.triggerGpsAcquisition = function(event) {
            if (event) event.stopPropagation();
            if (!DOM.gpsBtn) return;
            if (!navigator.geolocation) return triggerSystemAlert("GPS Unsupported", "Geolocation is not supported.", "⚠️");

            DOM.gpsBtn.style.opacity = "0.5";
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    DOM.gpsBtn.style.opacity = "1";
                    currentUserCoordinates = { lat: position.coords.latitude, lng: position.coords.longitude };
                    isGpsActive = true;
                    DOM.gpsBtn.classList.add('active-gps');
                    DOM.container.innerHTML = `<div style="text-align:center; padding: 30px; font-weight:600; color:#64748B;">Searching Database for items within 50km...</div>`;
                    await fetchNearbyItemsFromDB();
                },
                (error) => {
                    DOM.gpsBtn.style.opacity = "1";
                    triggerSystemAlert("GPS Error", "Unable to retrieve position.", "📍");
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        };

        function setupGpsDetectionControl() {
            if (!DOM.gpsBtn) return;
            DOM.gpsBtn.addEventListener('click', () => {
                if (isGpsActive) {
                    isGpsActive = false;
                    DOM.gpsBtn.classList.remove('active-gps');
                    localCachedBroadcasts = []; lastLoadedTimestamp = null; lastLoadedKey = null; hasMoreItems = true;
                    DOM.container.innerHTML = '';
                    fetchItemsBatch();
                } else { window.triggerGpsAcquisition(); }
            });
        }

        function restoreScrollPosition() {
            const urlParams = new URLSearchParams(window.location.search);
            const targetItemId = urlParams.get('returnId');
            const savedPos = sessionStorage.getItem('rental_scroll_pos');

            if (targetItemId) {
                const targetCard = document.getElementById(`item-card-${targetItemId}`);
                if (targetCard) {
                    targetCard.scrollIntoView({ block: 'center', behavior: 'smooth' });
                    targetCard.style.outline = '2px solid #38BDF8';
                    setTimeout(() => { targetCard.style.outline = 'none'; }, 2000);
                    return;
                }
            }
            if (savedPos !== null) {
                window.scrollTo({ top: parseInt(savedPos, 10), behavior: 'smooth' });
                sessionStorage.removeItem('rental_scroll_pos');
            }
        }

        window.openFullNewsReader = function(itemId, path) {
            sessionStorage.setItem('rental_scroll_pos', window.scrollY.toString());
            window.location.href = `rentalfull.html?id=${encodeURIComponent(itemId)}&path=${encodeURIComponent(path || 'posts')}`;
        };

        function triggerSystemAlert(title, message, icon = "ℹ️") {
            DOM.popupTitleNode.innerText = title; DOM.popupDescNode.innerText = message; DOM.popupIconNode.innerText = icon;
            DOM.popupModal.classList.add('show-popup');
        }

        window.navigateToAuthorProfile = function(event, userId, userName) {
            if (event) event.stopPropagation();
            if (userId && userId !== 'unknown') window.location.href = `user.html?userId=${encodeURIComponent(userId)}&userName=${encodeURIComponent(userName || 'User')}`;
        };

        window.toggleFollowUser = async function(event, authorId) {
            if (event) event.stopPropagation();
            const activeUserId = getActiveLoggedInUserId();
            if (!activeUserId) return triggerSystemAlert("Sign In Required", "Please sign in to follow.", "🔐");
            if (activeUserId === authorId) return triggerSystemAlert("Action Restricted", "You cannot follow yourself.", "ℹ️");

            const followRef = ref(db, `users/${activeUserId}/following_list/${authorId}`);
            const followingCountRef = ref(db, `users/${activeUserId}/following`);
            const followerCountRef = ref(db, `users/${authorId}/followers`);
            
            const isFollowing = userFollowingSet.has(authorId);

            try {
                if (isFollowing) { 
                    await remove(followRef); 
                    userFollowingSet.delete(authorId); 
                    runTransaction(followingCountRef, current => Math.max(0, (current || 1) - 1));
                    runTransaction(followerCountRef, current => Math.max(0, (current || 1) - 1));
                } else { 
                    await set(followRef, true); 
                    userFollowingSet.add(authorId); 
                    runTransaction(followingCountRef, current => (current || 0) + 1);
                    runTransaction(followerCountRef, current => (current || 0) + 1);
                }
                
                document.querySelectorAll(`.follow-btn-${authorId}`).forEach(btn => {
                    btn.innerText = isFollowing ? "+ Follow" : "Following";
                    isFollowing ? btn.classList.remove('following') : btn.classList.add('following');
                });
            } catch (err) { console.error("Follow error:", err); }
        };

        window.toggleLikePost = async function(event, itemId, path) {
            if (event) event.stopPropagation();
            const activeUserId = getActiveLoggedInUserId();
            if (!activeUserId) return triggerSystemAlert("Sign In Required", "Please sign in to like items.", "❤️");
            
            const likedByRef = ref(db, `${path}/${itemId}/likedBy/${activeUserId}`);
            const likesCountRef = ref(db, `${path}/${itemId}/likes`);

            try {
                const snap = await get(likedByRef);
                const isLiked = snap.exists() && snap.val() === true;
                if (isLiked) {
                    await remove(likedByRef);
                    await runTransaction(likesCountRef, (current) => Math.max(0, (current || 1) - 1));
                } else {
                    await set(likedByRef, true);
                    await runTransaction(likesCountRef, (current) => (current || 0) + 1);
                }

                const cachedItem = localCachedBroadcasts.find(i => i.id === itemId);
                if (cachedItem) {
                    if (!cachedItem.likedBy) cachedItem.likedBy = {};
                    if (isLiked) { delete cachedItem.likedBy[activeUserId]; cachedItem.likes = Math.max(0, (cachedItem.likes || 1) - 1); } 
                    else { cachedItem.likedBy[activeUserId] = true; cachedItem.likes = (cachedItem.likes || 0) + 1; }
                }

                const likeBtn = document.getElementById(`like-btn-${itemId}`);
                const likeCountNode = document.getElementById(`like-count-${itemId}`);
                if (likeBtn && likeCountNode) {
                    let currentCount = parseInt(likeCountNode.innerText || '0', 10);
                    likeBtn.classList.toggle('liked', !isLiked);
                    likeCountNode.innerText = isLiked ? Math.max(0, currentCount - 1) : currentCount + 1;
                }
            } catch (err) { console.error("Like error:", err); }
        };

        window.toggleCommentBox = function(event, itemId) {
            if (event) event.stopPropagation();
            const box = document.getElementById(`comments-box-${itemId}`);
            if (box) box.classList.toggle('show');
        };

        window.submitInlineComment = async function(event, itemId, path) {
            if (event) event.stopPropagation();
            const activeUserId = getActiveLoggedInUserId();
            if (!activeUserId) return triggerSystemAlert("Sign In Required", "Please sign in to comment.", "💬");
            
            const inputEl = document.getElementById(`comment-input-${itemId}`);
            if (!inputEl || !inputEl.value.trim()) return;
            const commentText = inputEl.value.trim(); inputEl.value = '';
            
            const userFirstName = currentUserDisplayName.trim().split(' ')[0] || 'User';

            try {
                const commentId = Date.now().toString();
                await set(ref(db, `${path}/${itemId}/comments/${commentId}`), {
                    userId: activeUserId, 
                    userName: userFirstName, 
                    text: commentText, 
                    timestamp: Date.now(),
                    userPhoto: currentUserPhoto
                });

                const commentsCountRef = ref(db, `${path}/${itemId}/commentsCount`);
                await runTransaction(commentsCountRef, current => (current || 0) + 1);

                const listContainer = document.getElementById(`comments-list-${itemId}`);
                if (listContainer) {
                    const cItem = document.createElement('div'); 
                    cItem.className = 'comment-preview-wrapper';
                    
                    const avatarHTML = currentUserPhoto 
                        ? `<img src="${currentUserPhoto}" class="comment-user-avatar">` 
                        : `<div class="comment-user-initial">${userFirstName.charAt(0)}</div>`;

                    cItem.innerHTML = `${avatarHTML} <div class="comment-text-content"><strong>${userFirstName}:</strong> ${commentText}</div>`;
                    listContainer.appendChild(cItem);
                }
                const cCountNode = document.getElementById(`comment-count-${itemId}`);
                if (cCountNode) cCountNode.innerText = parseInt(cCountNode.innerText || '0', 10) + 1;
            } catch (err) { console.error("Comment error:", err); }
        };

        function extractAllImages(item) {
            let list = [];
            if (item.imageUrl && typeof item.imageUrl === 'string') list.push(item.imageUrl.trim());
            if (item.images) {
                if (Array.isArray(item.images)) item.images.forEach(img => { if (typeof img === 'string' && !list.includes(img)) list.push(img.trim()); });
                else if (typeof item.images === 'object') Object.values(item.images).forEach(img => { if (typeof img === 'string' && !list.includes(img)) list.push(img.trim()); });
            }
            return list.slice(0, 3);
        }

        function extractFullLocationString(item) {
            let parts = [];
            if (item.locationDetails) {
                if (item.locationDetails.city) parts.push(item.locationDetails.city);
                if (item.locationDetails.subcity) parts.push(item.locationDetails.subcity);
                if (item.locationDetails.uniqueName) parts.push(`(${item.locationDetails.uniqueName})`);
            }
            return parts.length > 0 ? parts.join(', ') : (item.location || item.city || 'Location not specified');
        }

        function buildCategorySpecsHTML(item) {
            const specsObj = item.categorySpecificDetails || item.specifications || item.specs || item.details;
            if (specsObj && typeof specsObj === 'object' && Object.keys(specsObj).length > 0) {
                let html = `<div class="category-specs-container"><div class="category-specs-title">Property Specifications</div><div class="info-terms-list">`;
                Object.keys(specsObj).slice(0, 3).forEach(key => {
                    const val = specsObj[key];
                    if (val !== undefined && val !== null && val !== '') {
                        html += `<div class="info-term-item"><span class="info-term-label">${key.replace(/([A-Z])/g, ' $1').toLowerCase()}</span><span class="info-term-value">${typeof val === 'object' ? JSON.stringify(val) : val}</span></div>`;
                    }
                });
                return html + `</div></div>`;
            }
            return `<div class="category-specs-container"><div class="category-specs-title">Property Specifications</div><div style="font-size:12px; color:#64748B; font-weight: 600;">Standard property specifications apply.</div></div>`;
        }

        function buildSingleNewsCardHTML(item) {
            const headline = item.title || "Rental Item";
            const category = item.rentalType || item.category || "Rental";
            const allImages = extractAllImages(item);
            const authorId = item.userId || item.uid || item.postedBy || 'unknown';
            
            const fullAuthorName = item.authorName || item.userName || item.displayName || item.fullName || item.firstName || 'User';
            const firstName = fullAuthorName.trim().split(' ')[0] || 'User';
            const authorPhoto = item.userPhoto || item.photoURL || item.profilePicture || '';
            const fullLocationStr = extractFullLocationString(item);
            const categorySpecsHTML = buildCategorySpecsHTML(item);
            
            const likeCount = typeof item.likes === 'number' ? item.likes : (item.likedBy ? Object.keys(item.likedBy).length : 0);
            
            const activeUserId = getActiveLoggedInUserId();
            const isLikedByMe = !!(activeUserId && ((item.likedBy && item.likedBy[activeUserId]) || (typeof item.likes === 'object' && item.likes && item.likes[activeUserId])));
            
            const isOwner = activeUserId && (activeUserId === authorId || String(activeUserId).replace(/\D/g, '') === String(authorId).replace(/\D/g, ''));
            const isFollowingAuthor = userFollowingSet.has(authorId);
            
            const commentsList = item.comments ? Object.values(item.comments) : [];
            const commentCount = typeof item.commentsCount === 'number' ? item.commentsCount : commentsList.length;

            let imageHTML = allImages.length > 0 ? `<div class="broadcast-image-frame"><img src="${allImages[0]}" loading="lazy" decoding="async" onload="this.classList.add('loaded')"></div>` : "";

            let distanceChipHTML = (isGpsActive && currentUserCoordinates && item._calculatedDistance !== undefined) 
                ? `<span class="animated-distance-chip" onclick="triggerGpsAcquisition(event)"><span class="gps-dot"></span><span>${item._calculatedDistance < 1 ? `${Math.round(item._calculatedDistance * 1000)}m` : `${item._calculatedDistance.toFixed(1)}km`}</span></span>`
                : `<span class="animated-distance-chip no-gps" onclick="triggerGpsAcquisition(event)"><span class="gps-dot"></span><span>GPS</span></span>`;
            
            let commentsPreviewHTML = commentsList.slice(-2).map(c => {
                const avatarHTML = c.userPhoto 
                    ? `<img src="${c.userPhoto}" class="comment-user-avatar">` 
                    : `<div class="comment-user-initial">${(c.userName || 'U').charAt(0)}</div>`;
                return `
                    <div class="comment-preview-wrapper">
                        ${avatarHTML}
                        <div class="comment-text-content"><strong>${c.userName || 'User'}:</strong> ${c.text || ''}</div>
                    </div>`;
            }).join('');

            return `
                <div class="post-author-header">
                    <div class="author-info-left" onclick="navigateToAuthorProfile(event, '${authorId}', '${fullAuthorName}')">
                        ${authorPhoto ? `<img class="author-avatar" src="${authorPhoto}">` : `<div class="author-avatar">${firstName.charAt(0).toUpperCase()}</div>`}
                        <div class="author-name-box"><span class="author-first-name">${firstName}</span><span class="author-sub-label">Posted item</span></div>
                    </div>
                    <div class="author-actions-right">
                        ${distanceChipHTML}
                        ${(!isOwner && authorId !== 'unknown') ? `<button class="btn-follow-author follow-btn-${authorId} ${isFollowingAuthor ? 'following' : ''}" onclick="toggleFollowUser(event, '${authorId}')">${isFollowingAuthor ? 'Following' : '+ Follow'}</button>` : ''}
                        <button class="btn-view-author-profile" onclick="navigateToAuthorProfile(event, '${authorId}', '${fullAuthorName}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Preview</span></button>
                    </div>
                </div>
                <div class="badge-meta-row" style="display:flex; align-items:center; gap:6px; margin-bottom:8px;">
                    <span class="spotlight-pill">${category}</span>
                    ${allImages.length > 1 ? `<span style="font-size:10px; background:#F1F5F9; border:1px solid #E2E8F0; padding:2px 6px; border-radius:10px; color:#0F172A; font-weight:700;">📷 ${allImages.length} Photos</span>` : ''}
                </div>
                
                ${imageHTML}
                
                <div class="clickable-news-content">
                    <h2 class="broadcast-title">${headline}</h2>
                    <div style="margin-top: 6px; font-size: 12.5px; color: #475569; font-weight: 600;">Location: <span class="location-text-val">${fullLocationStr}</span></div>
                    ${categorySpecsHTML}
                </div>
                <div class="post-social-bar">
                    <div style="display:flex; align-items:center; gap:4px;">
                        <button class="social-action-btn ${isLikedByMe ? 'liked' : ''}" id="like-btn-${item.id}" onclick="toggleLikePost(event, '${item.id}', '${item._dbPath || 'posts'}')">
                            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l8.78-8.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <span id="like-count-${item.id}">${likeCount}</span>
                        </button>
                        <button class="social-action-btn" onclick="toggleCommentBox(event, '${item.id}')">
                            <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            <span id="comment-count-${item.id}">${commentCount}</span>
                        </button>
                    </div>
                    <button class="btn-details-dark-flat" onclick="openFullNewsReader('${item.id}', '${item._dbPath || 'posts'}')">Details &rarr;</button>
                </div>
                <div class="quick-comments-preview" id="comments-box-${item.id}">
                    <div id="comments-list-${item.id}">${commentsPreviewHTML}</div>
                    <div class="comment-input-inline-box" onclick="event.stopPropagation()">
                        <input type="text" class="comment-input-field" id="comment-input-${item.id}" placeholder="Add a comment..." />
                        <button class="comment-submit-btn" onclick="submitInlineComment(event, '${item.id}', '${item._dbPath || 'posts'}')">Post</button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
