    <style>
        /* Base Light / White UI Theme */
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        .app-view {

            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Container for Vertically Stacked Action Buttons */
        .action-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
        }

        /* Top Light Wave Gradient Background Accent */
        .bg-wave-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            pointer-events: none;
        }

        /* Base Button Styles */
        .btn-get-started, .btn-install {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            max-width: 280px;
            padding: 18px 32px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
            box-sizing: border-box;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        /* Get Started Button */
        .btn-get-started {
            background: linear-gradient(135deg, #0F172A, #1E293B);
            color: #FFFFFF;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
        }

        /* Always Visible Install App Button */
        .btn-install {
            background: #008000;
            color: #FFFFFF;
            box-shadow: 0 10px 25px rgba(0, 128, 0, 0.25);
        }

        .btn-get-started:active, .btn-install:active {
            transform: scale(0.96);
        }

        .btn-get-started svg, .btn-install svg {
            width: 22px;
            height: 22px;
            stroke: #FFFFFF;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>

<body>

    <div class="app-view">
        <!-- Hidden Image for SEO -->
        <img src="https://delala.online/s.png" alt="Delala Logo Preview" style="display:none;">

        <!-- Top Light Wave Gradient -->

            </defs>
        </svg>

        <!-- Stacked Buttons Container -->

            <a href="rental.html" class="btn-get-started">

                    <polyline points="12 5 19 12 12 19"></polyline>

            <!-- Always visible Install App button -->
            <button id="pwaInstallBtn" class="btn-install">
                <span>Install App</span>
                <svg viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>

                </svg>
            </button>

    </div>

    <!-- Frontend Connection Detection & Service Worker Registration -->
    <script>
        // --- Real-Time Offline & Connection Checking ---
        
        // 1. Handle complete network loss in real-time
        window.addEventListener('offline', () => {
            console.log('[App] Network lost, redirecting to offline screen...');
            window.location.href = '/offline.html';
        });

        // 2. Function to check for low connection speeds
        function checkConnectionSpeed() {
            if ('connection' in navigator) {
                const effectiveType = navigator.connection.effectiveType;
                
                // If speed is slow-2g or 2g, redirect to low.html
                if (effectiveType === 'slow-2g' || effectiveType === '2g') {
                    if (!window.location.pathname.includes('/low.html')) {
                        console.log(`[App] Slow connection detected (${effectiveType}), redirecting...`);
                        window.location.href = '/low.html';
                    }
                }
            }
        }

        // 3. Listen for dynamic changes in network quality
        if ('connection' in navigator) {
            navigator.connection.addEventListener('change', checkConnectionSpeed);
        }

        // --- Service Worker & Install Logic ---
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                
                // Check status immediately on load
                if (!navigator.onLine) {
                    if (!window.location.pathname.includes('/offline.html')) {
                        window.location.href = '/offline.html';
                    }
                } else {
                    checkConnectionSpeed();
                }

                // Register Service Worker
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registered:', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('pwaInstallBtn');

        // Capture standard install prompt when available
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // Always handle click event
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to install prompt: ${outcome}`);
                deferredPrompt = null;
            } else {
                // Fallback guidance if prompt isn't natively available (iOS or already installed)
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (isIOS) {
                    alert('To install Delala on iOS: tap the Share button in Safari and select "Add to Home Screen".');
                } else {
                    alert('App installation prompt is not ready or the app is already installed. Use your browser menu to "Add to Home Screen".');
                }
            }
        });

        window.addEventListener('appinstalled', () => {
            deferredPrompt = null;
            console.log('Delala app installed successfully.');
        });
    </script>
