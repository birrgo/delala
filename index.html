<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>Yala Tech | Online Work in Ethiopia, Tech Tips & Vacancies</title>
    <meta name="title" content="Shiqela | Online Work in Ethiopia, Tech Tips & Vacancies">
    <meta name="description" content="Shiqela is your primary platform for online work in Ethiopia, tech tips, digital skills, and vacancies.">
    <link rel="canonical" href="https://shiqela.online/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="news.css">
    <style>
        .menu-iframe-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .menu-iframe-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .menu-iframe-drawer {
            position: absolute;
            top: 0;
            left: 0;
            width: 75%;
            height: 100%;
            border: none;
            background: #081B38;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.3);
        }
        .menu-iframe-overlay.active .menu-iframe-drawer {
            transform: translateX(0);
        }

        :root {
            --bottom-nav-height: 65px;
        }

        .bottom-nav {
            z-index: 99998 !important; 
        }
        .search-modal-overlay {
            z-index: 9990 !important;
            padding-bottom: 140px !important;
        }

        /* UPDATED AD CONTAINER CSS */
        .ad-container-wrapper {
            position: fixed;
            /* Removed the extra gap so it sits flush on the bottom nav */
            bottom: calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px));
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none; 
            z-index: 99999 !important;
        }
        .admob-banner-container {
            width: 100%; /* Forces ad to fit full width */
            height: auto;
            min-height: 50px;
            background: #ffffff;
            color: #202124;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 12px;
            border-top: 1px solid #dadce0; /* Top border only for seamless look */
            box-shadow: 0px -4px 12px rgba(0, 0, 0, 0.1); /* Upward shadow */
            pointer-events: auto;
        }
        /* END UPDATED AD CONTAINER CSS */

        .ad-badge {
            background: #fbbc04;
            color: #202124;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .clickable-news-card {
            cursor: pointer;
        }
        .inline-feed-ad {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            padding: 16px;
            margin-top: 14px;
            text-align: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }
        
        .feed-loader-box {
            text-align: center;
            padding: 20px;
            margin: 15px 20px;
            color: #9ca3af;
            font-size: 14px;
            font-weight: 700;
            display: none;
            transition: all 0.2s ease;
        }
        .loader-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(156, 163, 175, 0.3);
            border-top-color: #9ca3af;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        .initial-fullscreen-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px;
            text-align: center;
        }
        .initial-loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-view">
        <svg class="bg-wave bg-wave-top" viewBox="0 0 375 200" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 0H375V75C375 75 280 155 0 95V0Z" fill="url(#paint0_linear)"/>
            <defs>
                <linearGradient id="paint0_linear" x1="187.5" y1="0" x2="187.5" y2="200" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#081B38"/>
                    <stop offset="1" stop-color="#0F2C59"/>

        <div class="menu-iframe-overlay" id="menuIframeOverlay">
            <iframe class="menu-iframe-drawer" id="menuIframe" src="about:blank"></iframe>

        <div class="search-modal-overlay" id="searchModalOverlay">

                    Type a word above to search all posted items.

            </div>
        </div>

        <!-- UPDATED HEADER WITH "WHAT'S NEW" -->
        <header class="nav-header" style="display: flex; align-items: center; justify-content: space-between; padding-left: 16px; padding-right: 16px; gap: 14px;">
            <div class="header-left-group" style="display: flex; align-items: center; gap: 12px;">
                <button type="button" class="menu-action-btn" id="openMenuIframeBtn" aria-label="Open Menu" style="background: none; border: none; cursor: pointer; color: #ffffff; padding: 0; display: flex; align-items: center; justify-content: center;">
                    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <span style="color: #ffffff; font-size: 17px; font-weight: 700; white-space: nowrap;">What's new?</span>
            </div>

            <div class="header-center-group" style="flex: 1;" onclick="document.getElementById('openSearchBtn').click()">
                <div style="background: rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ffffff" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <span style="font-size: 14px; color: #ffffff; font-weight: 600;">Search updates...</span>
                </div>
            </div>

            <button class="search-action-btn" id="openSearchBtn" style="display: none;"></button>
        </header>

        <main class="app-content" id="mainContentArea">
            <div class="category-filter-row filter-btn-grid" id="filterPillsRow">
                <button class="filter-pill filter-btn active-pill active" data-filter="Shikela Update" data-category="Shikela Update">Yala Tech Update</button>
                <button class="filter-pill filter-btn" data-filter="Shikela Tips" data-category="Shikela Tips">Yala Tech Tips</button>
            </div>

            <div class="broadcasts-container" id="broadcastsContainer">
                <div class="initial-fullscreen-loader">
                    <div class="initial-loader-spinner"></div>
                    <h2 style="color: #ffffff; font-size: 16px; font-weight: 700; margin: 0;">Loading latest updates...</h2>
                    <p style="color: #9ca3af; font-size: 13px; margin-top: 8px;">Please wait while we connect</p>
                </div>
            </div>

            <div class="feed-loader-box" id="feedLoaderBox">
                <span class="loader-spinner" id="loaderSpinner" style="display:none;"></span>
                <span id="loaderText">Loading...</span>

            <footer class="verified-footer-shield">
                <span class="footer-shield-text">Yala Tech Matrix Verified</span>

        <div class="ad-container-wrapper" id="adContainerWrapper" style="display: none;">
            <div class="admob-banner-container" id="admobBannerNode">
                <div style="display:flex; align-items:center; gap:8px;">
                    <span class="ad-badge">Ad</span>
                    <span style="font-size:12px; font-weight:600; color:#3c4043;" id="bannerAdLabel">AdMob Banner</span>
                </div>
                <button style="background:#1a73e8; color:#fff; border:none; padding:5px 12px; border-radius:4px; font-size:11px; font-weight:700; cursor:pointer;">LEARN MORE</button>
            </div>
        </div>

        <nav class="bottom-nav" id="mainBottomNav">
            <a id="nav-home" href="index.html" class="nav-item active">
                <div class="icon-bg">
                    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                </div>

                    <svg viewBox="0 0 24 24"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"></path></svg>

    <!-- Capacitor & AdMob -->
    <script src="https://cdn.jsdelivr.net/npm/@capacitor/core@5.0.0/dist/capacitor.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@capacitor-community/admob@5.0.0/dist/plugin.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCqwgwiukwKb7o6gwnaLoPQSWc7BfMDuYQ",
            authDomain: "besuad.firebaseapp.com",
            databaseURL: "https://besuad-default-rtdb.firebaseio.com",
            projectId: "besuad",
            storageBucket: "besuad.firebasestorage.app",
            messagingSenderId: "641705823615",
            appId: "1:641705823615:web:6502b2511ff8c0f251de4a",
            measurementId: "G-2YSX71N08Q"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const APP_NODE_NAME = "app1";

        let rawShikelaNewsData = {};
        let rawNewNewsData = {};
        let localCachedBroadcasts = [];
        let currentActiveCategoryFilter = "Shikela Update";
        let isBannerInitialized = false;

        let currentVisibleFeedCount = 0;
        let isFetchingMore = false;
        const FEED_BATCH_SIZE = 3;

        window.globalAdConfig = {
            status: false,
            bannerId: "",
            interstitialId: "",
            nativeId: "",
            interstitialInterval: 3,
            placements: {}
        };

        function initApp() {
            adjustBottomNavigationOffsets();
            fetchDatabaseAdConfig();
            streamLiveAdminUpdatesLog();
            bindVisualInterfaceControls();
            setupSearchEngineControls();
            setupIntersectionObserver();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        window.addEventListener('pageshow', (event) => {
            if (event.persisted && window.globalAdConfig.status) {
                setTimeout(() => {
                    triggerBannerAd();
                }, 300);
            }
        });

        function setupIntersectionObserver() {
            const loaderBox = document.getElementById('feedLoaderBox');
            if (!loaderBox) return;

            const options = {
                root: null,
                rootMargin: '400px',
                threshold: 0
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !document.getElementById('searchModalOverlay').classList.contains('active-search')) {
                        executeLoadMoreBatch();
                    }
                });
            }, options);

            observer.observe(loaderBox);
        }

        function executeLoadMoreBatch() {
            if (isFetchingMore) return;
            
            const filtered = localCachedBroadcasts.filter(item => (item.category || "").trim().toLowerCase() === currentActiveCategoryFilter.trim().toLowerCase());
            if (currentVisibleFeedCount >= filtered.length) return;

            isFetchingMore = true;
            
            const loaderSpinner = document.getElementById('loaderSpinner');
            const loaderText = document.getElementById('loaderText');
            
            if (loaderSpinner) loaderSpinner.style.display = 'inline-block';
            if (loaderText) loaderText.innerText = 'Loading...';

            setTimeout(() => {
                renderFilteredBroadcasts(false); 
                isFetchingMore = false;
            }, 300); 
        }

        function updateLoaderUI() {
            const loaderBox = document.getElementById('feedLoaderBox');
            const loaderSpinner = document.getElementById('loaderSpinner');
            const loaderText = document.getElementById('loaderText');
            
            if (!loaderBox) return;

            const filtered = localCachedBroadcasts.filter(item => (item.category || "").trim().toLowerCase() === currentActiveCategoryFilter.trim().toLowerCase());

            loaderBox.style.display = 'block';

            if (currentVisibleFeedCount >= filtered.length) {
                if (filtered.length > 0) {
                    if (loaderSpinner) loaderSpinner.style.display = 'none';
                    if (loaderText) loaderText.innerText = 'All updates loaded ✅';
                } else {
                    loaderBox.style.display = 'none';
                }
            } else {
                if (loaderSpinner) loaderSpinner.style.display = 'none';
                if (loaderText) loaderText.innerText = 'Loading...';
            }
        }

        function adjustBottomNavigationOffsets() {
            const nav = document.getElementById('mainBottomNav');
            if (nav) {
                const navHeight = nav.offsetHeight || 65;
                document.documentElement.style.setProperty('--bottom-nav-height', `${navHeight}px`);
                const mainArea = document.getElementById('mainContentArea');
                if (mainArea) mainArea.style.paddingBottom = `${navHeight + 65}px`;
            }
        }

        function fetchDatabaseAdConfig() {
            const adManagerRef = ref(db, `${APP_NODE_NAME}/adManager`);
            onValue(adManagerRef, (snapshot) => {
                if (!snapshot.exists()) return;

                const adData = snapshot.val();
                const isStatusOn = (adData.adStatus === "ON" || adData.adStatus === true || adData.adStatus === "true" || adData.adStatus === 1);

                window.globalAdConfig = {
                    status: isStatusOn,
                    bannerId: (adData.adMobBannerUnitId || "ca-app-pub-3940256099942544/6300978111").trim(),
                    interstitialId: (adData.adMobInterstitialUnitId || "ca-app-pub-3940256099942544/1033173712").trim(),
                    nativeId: (adData.adMobNativeUnitId || "ca-app-pub-3940256099942544/2247696110").trim(),
                    interstitialInterval: parseInt(adData.interstitialAdInterval, 10) || 3,
                    placements: adData.placements || {},
                    isTesting: (adData.adMobBannerUnitId || "").includes("3940256099942544")
                };

                if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                    const { AdMob } = Capacitor.Plugins;
                    AdMob.initialize({
                        requestTrackingAuthorization: true,
                        initializeForTesting: window.globalAdConfig.isTesting
                    }).then(() => {
                        setTimeout(triggerBannerAd, 500);
                    }).catch(e => console.warn("AdMob Init:", e));
                } else {
                    triggerBannerAd();
                }
                
                if (localCachedBroadcasts.length > 0) renderFilteredBroadcasts(true);
            });
        }

        async function triggerBannerAd() {
            const adWrapper = document.getElementById('adContainerWrapper');
            const nav = document.getElementById('mainBottomNav');
            const navHeight = nav ? nav.offsetHeight : 65;

            const shouldShowBanner = window.globalAdConfig.status && 
                                     (window.globalAdConfig.placements?.bannerAdHomePage !== false) && 
                                     Boolean(window.globalAdConfig.bannerId);

            if (!shouldShowBanner) {
                if (adWrapper) adWrapper.style.display = 'none';
                return;
            }

            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                const { AdMob, BannerAdSize, BannerAdPosition } = Capacitor.Plugins;
                try {
                    if (isBannerInitialized) {
                        await AdMob.resumeBanner().catch(() => {});
                    } else {
                        await AdMob.showBanner({
                            adId: window.globalAdConfig.bannerId,
                            adSize: 'BANNER',
                            position: 'BOTTOM_CENTER',
                            margin: navHeight
                        });
                        isBannerInitialized = true;
                    }
                } catch (e) {
                    console.error("Banner Show Error:", e);
                }
            } else {
                if (adWrapper) {
                    adWrapper.style.display = 'flex';
                    const label = document.getElementById('bannerAdLabel');
                    if (label) label.innerText = `Banner: ${window.globalAdConfig.bannerId.slice(-8)}`;
                }
            }
        }

        window.navigateToFull = async function(itemId, nodeName) {
            const targetUrl = `full.html?id=${encodeURIComponent(itemId)}&node=${encodeURIComponent(nodeName || 'shikelaNews')}`;
            
            const adWrapper = document.getElementById('adContainerWrapper');
            if (adWrapper) adWrapper.style.display = 'none';

            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                const { AdMob } = Capacitor.Plugins;
                try {
                    await AdMob.hideBanner().catch(() => {});
                    await AdMob.removeBanner().catch(() => {});
                    isBannerInitialized = false; 
                } catch (e) {
                    console.warn("Banner cleanup warning:", e);
                }
            }

            window.location.href = targetUrl;
        };

        function extractValidTimestamp(item) {
            const raw = item.timestamp || item.updatedAt || item.createdAtTimestamp || item.createdAt || item.date;
            if (typeof raw === 'number' && !isNaN(raw)) return raw;
            if (typeof raw === 'string') {
                const parsed = parseInt(raw, 10);
                if (!isNaN(parsed) && parsed > 1000000000) return parsed < 100000000000 ? parsed * 1000 : parsed;
                const dateParsed = new Date(raw).getTime();
                if (!isNaN(dateParsed)) return dateParsed;
            }
            return Date.now();
        }

        function rebuildAndRenderBroadcastsCache() {
            localCachedBroadcasts = [];
            const addNode = (dataObj, defaultCat, nodeName) => {
                Object.keys(dataObj).forEach(key => {
                    const item = dataObj[key];
                    if (typeof item === 'object' && item !== null) {
                        localCachedBroadcasts.push({
                            id: key,
                            sourceNode: nodeName,
                            ...item,
                            title: item.title || item.newsTitle || defaultCat,
                            category: item.category || defaultCat,
                            resolvedTimestamp: extractValidTimestamp(item)
                        });
                    }
                });
            };
            addNode(rawShikelaNewsData, "Shikela Update", "shikelaNews");
            addNode(rawNewNewsData, "Shikela Tips", "newNews");
            localCachedBroadcasts.sort((a, b) => b.resolvedTimestamp - a.resolvedTimestamp);
            
            renderFilteredBroadcasts(true);
        }

        function streamLiveAdminUpdatesLog() {
            onValue(ref(db, `${APP_NODE_NAME}/shikelaNews`), (snapshot) => {
                rawShikelaNewsData = snapshot.exists() ? snapshot.val() : {};
                rebuildAndRenderBroadcastsCache();
            });
            onValue(ref(db, `${APP_NODE_NAME}/newNews`), (snapshot) => {
                rawNewNewsData = snapshot.exists() ? snapshot.val() : {};
                rebuildAndRenderBroadcastsCache();
            });
        }

        function buildSingleNewsCardHTML(item) {
            const headline = item.title || item.newsTitle || "Yala Tech Update";
            const fullContent = item.content || item.message || "";
            const displayCategory = (item.category || "Yala Tech Update").replace('Shikela', 'Yala Tech'); 
            const category = item.category || "Shikela Update";
            const imageUrl = item.imageUrl || item.image || "";

            const previewContent = fullContent.length > 120 ? fullContent.substring(0, 120).trim() + "..." : fullContent;
            const numericalTime = item.resolvedTimestamp || Date.now();
            const pillBadgeClass = category.toLowerCase().includes("tips") ? "spotlight-pill system-badge" : "spotlight-pill";

            let imageHTML = imageUrl ? `<div class="broadcast-image-frame"><img src="${imageUrl}" onload="this.classList.add('loaded')"></div>` : "";

            return `
                <div class="clickable-news-card" onclick="navigateToFull('${item.id}', '${item.sourceNode}')">
                    <div class="badge-meta-row">
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span class="${pillBadgeClass}" style="text-transform: uppercase;">${displayCategory}</span>
                        </div>
                        <span class="timestamp-log-text" data-timestamp="${numericalTime}"></span>
                    </div>
                    ${imageHTML}
                    <div class="clickable-news-content">
                        <h2 class="broadcast-title">${headline}</h2>
                        <p class="broadcast-body-text">${previewContent}</p>
                    </div>
                </div>
            `;
        }

        function getInlineNativeAdHTML() {
            if (!window.globalAdConfig.status) return "";
            
            const nativeId = window.globalAdConfig.nativeId || "ca-app-pub-3940256099942544/2247696110";
            
            return `
                <div class="inline-feed-ad">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
                        <span class="ad-badge">Ad</span>
                        <span style="font-size:11px; color:#64748b; font-weight:600;">Sponsored Content</span>
                    </div>
                    <div style="font-size:32px; margin-bottom:8px;">💡</div>
                    <strong style="font-size:15px; color:#1e293b; display:block;">Promoted Opportunities</strong>
                    <span style="font-size:13px; color:#64748b; display:block; margin: 4px 0 2px 0;">In-feed content placement directly embedded in stream.</span>
                    <span style="font-size:10px; color:#9ca3af; display:block; margin-bottom: 12px; word-break: break-all;">ID: ${nativeId}</span>
                    <button style="background:#2563eb; color:#fff; border:none; padding:12px 18px; border-radius:8px; font-size:13px; font-weight:700; width:100%; cursor:pointer; box-shadow: 0 2px 8px rgba(37,99,235,0.25);">LEARN MORE</button>
                </div>
            `;
        }

        function renderFilteredBroadcasts(reset = false) {
            const container = document.getElementById('broadcastsContainer');
            if (!container) return;

            const filtered = localCachedBroadcasts.filter(item => (item.category || "").trim().toLowerCase() === currentActiveCategoryFilter.trim().toLowerCase());
            
            if (reset) {
                container.innerHTML = "";
                currentVisibleFeedCount = 0;
            }

            if (filtered.length === 0) {
                if (reset) container.innerHTML = `<article class="featured-broadcast-card"><h2 class="broadcast-title">No updates posted today.</h2></article>`;
                updateLoaderUI();
                return;
            }

            const nextBatch = filtered.slice(currentVisibleFeedCount, currentVisibleFeedCount + FEED_BATCH_SIZE);
            if (nextBatch.length === 0) {
                updateLoaderUI();
                return; 
            }

            nextBatch.forEach((item) => {
                const card = document.createElement('article');
                card.className = "featured-broadcast-card";
                card.innerHTML = buildSingleNewsCardHTML(item);
                container.appendChild(card);
                
                currentVisibleFeedCount++;

                if (currentVisibleFeedCount % 2 === 0) {
                    if (window.globalAdConfig.status && window.globalAdConfig.placements?.nativeAdPostList !== false) {
                        const inlineAdWrapper = document.createElement('div');
                        inlineAdWrapper.innerHTML = getInlineNativeAdHTML();
                        container.appendChild(inlineAdWrapper);
                    }
                }
            });

            updateLoaderUI();
        }

        function setupSearchEngineControls() {
            const openBtn = document.getElementById('openSearchBtn');
            const closeBtn = document.getElementById('closeSearchDrawerBtn');
            const searchOverlay = document.getElementById('searchModalOverlay');
            const searchInput = document.getElementById('newsCodeSearchInput');

            if (openBtn) {
                openBtn.addEventListener('click', () => {
                    searchOverlay.classList.add('active-search');
                    if (searchInput) { searchInput.value = ''; searchInput.focus(); executeNewsSearchQuery(''); }
                });
            }
            if (closeBtn) {
                closeBtn.addEventListener('click', () => searchOverlay.classList.remove('active-search'));
            }
            if (searchInput) {
                searchInput.addEventListener('input', (e) => executeNewsSearchQuery(e.target.value));
            }
        }

        function executeNewsSearchQuery(query) {
            const resultsArea = document.getElementById('searchResultsArea');
            if (!resultsArea) return;

            const cleanQuery = query.trim().toLowerCase();
            if (!cleanQuery) {
                resultsArea.innerHTML = `<div style="text-align:center; padding:30px 20px; color:#ffffff; font-size:13px; font-weight:600;">Type any word or code above to search all posts.</div>`;
                return;
            }

            const matchedNews = localCachedBroadcasts.filter(item => {
                const code = String(item.newsCode || item.code || item.id || '').toLowerCase();
                const title = String(item.title || item.newsTitle || '').toLowerCase();
                const content = String(item.content || item.message || '').toLowerCase();
                const cat = String(item.category || '').toLowerCase();
                return code.includes(cleanQuery) || title.includes(cleanQuery) || content.includes(cleanQuery) || cat.includes(cleanQuery);
            });

            if (matchedNews.length === 0) {
                resultsArea.innerHTML = `<div style="text-align:center; padding:30px 20px; color:#ffffff; font-size:13px; font-weight:600;">No updates matching "<strong>${cleanQuery}</strong>" found.</div>`;
                return;
            }

            resultsArea.innerHTML = '';
            
            matchedNews.forEach((item) => {
                const card = document.createElement('article');
                card.className = "featured-broadcast-card";
                card.innerHTML = buildSingleNewsCardHTML(item);
                resultsArea.appendChild(card);
            });
        }

        function bindVisualInterfaceControls() {
            document.querySelectorAll('.filter-btn').forEach(pill => {
                pill.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(p => p.classList.remove('active-pill', 'active'));
                    this.classList.add('active-pill', 'active');
                    currentActiveCategoryFilter = this.getAttribute('data-filter') || "Shikela Update";
                    renderFilteredBroadcasts(true); 
                });
            });
        }
    </script>

    <script>
        const openBtn = document.getElementById('openMenuIframeBtn');
        const overlay = document.getElementById('menuIframeOverlay');
        openBtn.addEventListener('click', () => { document.getElementById('menuIframe').src = 'menu.html'; overlay.classList.add('active'); });
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active'); });
    </script>
</body>
</html>
