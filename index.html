    <style>
        /* Base Light / White UI Theme */
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        .app-view {
            background-color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Top Light Wave Gradient Background Accent */
        .bg-wave-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            pointer-events: none;
        }

        /* Centered Get Started Button Styling */
        .btn-get-started {
            position: relative;
            z-index: 10;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 85%;
            max-width: 280px;
            padding: 18px 32px;
            background: linear-gradient(135deg, #0F172A, #1E293B);
            color: #FFFFFF;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-align: center;
        }

        .btn-get-started:active {
            transform: scale(0.96);
            box-shadow: 0 5px 12px rgba(15, 23, 42, 0.2);
        }

        .btn-get-started svg {
            width: 22px;
            height: 22px;
            stroke: #FFFFFF;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div class="app-view">
        <!-- Hidden Image for SEO -->
        <img src="https://delala.online/s.png" alt="Delala Logo Preview" style="display:none;">

        <!-- Top Light Wave Gradient -->
        <svg class="bg-wave bg-wave-top" viewBox="0 0 375 200" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 0H375V75C375 75 280 155 0 95V0Z" fill="url(#paint0_linear)"/>
            <defs>
                <linearGradient id="paint0_linear" x1="187.5" y1="0" x2="187.5" y2="200" gradientUnits="userSpaceOnUse">
                    <stop stop-color="#E2E8F0"/>
                    <stop offset="1" stop-color="#F1F5F9"/>
                </linearGradient>
            </defs>
        </svg>

        <!-- Screen Centered Action -->
        <a href="rental.html" class="btn-get-started">
            <span>Get Started</span>
            <svg viewBox="0 0 24 24">
                <line x1="5" y1="12" x2="19" y2="12"></line>

            </svg>
        </a>
    </div>
